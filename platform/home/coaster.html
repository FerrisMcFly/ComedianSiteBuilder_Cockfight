<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coaster · ComicTable</title>
<meta name="description" content="A comedian's Coaster on ComicTable: their Tape, next dates, links and press kit.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/brand/tokens.css">
<style>
/* A comic's Coaster: their card on ComicTable, built like the real thing on a bar table.
   Round, printed, flips over (front: them; back: their next show and a QR code back to this page).
   Under it: the Tape, links, dates as ticket stubs, and who else is on the bill (tap to visit their Coaster).
   The comic picks a look; a look is a handful of colors plus the coaster's edge print. */
:root { --bg: #F3EAD7; --card: #FBF6EA; --ink: #1F1F1F; --muted: #5E584D; --line: #E2D6BC; --accent: #C4452E; --on-accent: #fff; --chip: #EFE4CC;
  --pulp: #F7F0DF; --print: #1F1F1F; --ring: #C4452E; --edge: repeating-conic-gradient(from 0deg, var(--ring) 0 4deg, transparent 4deg 8deg); --stain: rgba(196, 69, 46, .16); }
body.look-night { --bg: #141414; --card: #1E1E1E; --ink: #F3EAD7; --muted: #B5AC9A; --line: #34312C; --accent: #D9583F; --on-accent: #fff; --chip: #292725;
  --pulp: #232120; --print: #F3EAD7; --ring: #D9583F; --stain: rgba(217, 88, 63, .2); }
body.look-redwood { --bg: #A93A26; --card: #B9432E; --ink: #FFF7E8; --muted: #F7D9CC; --line: #CF6049; --accent: #1F1F1F; --on-accent: #F3EAD7; --chip: #B23D29;
  --pulp: #F3EAD7; --print: #A93A26; --ring: #1F1F1F; --stain: rgba(0, 0, 0, .18); }
body.look-mustard { --bg: #E0A21A; --card: #ECB232; --ink: #1F1F1F; --muted: #4A3A12; --line: #C98F12; --accent: #1F1F1F; --on-accent: #F3EAD7; --chip: #E7AA27;
  --pulp: #1F1F1F; --print: #E0A21A; --ring: #E0A21A; --stain: rgba(0, 0, 0, .14); }
body.look-spooky { --bg: #120E18; --card: #1C1624; --ink: #F4EBDD; --muted: #B6A9C2; --line: #352A44; --accent: #F07C1F; --on-accent: #120E18; --chip: #271F33;
  --pulp: #1E1726; --print: #F07C1F; --ring: #8D5BD6; --edge: repeating-conic-gradient(from 0deg, #F07C1F 0 6deg, #8D5BD6 6deg 12deg); --stain: rgba(240, 124, 31, .22); }
body.look-holiday { --bg: #17321F; --card: #1E3F28; --ink: #FBF3E4; --muted: #C9D8C3; --line: #2F5A3B; --accent: #D9443A; --on-accent: #fff; --chip: #24492F;
  --pulp: #FBF3E4; --print: #17321F; --ring: #D9443A; --edge: repeating-conic-gradient(from 0deg, #D9443A 0 5deg, #FBF3E4 5deg 10deg); --stain: rgba(217, 68, 58, .2); }
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--ct-sans, Inter, system-ui, sans-serif); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
[hidden] { display: none !important; }
.wrap { max-width: 560px; margin: 0 auto; padding: 22px 16px 40px; }

/* ---------- the coaster ---------- */
.table { position: relative; display: grid; place-items: center; padding: 26px 0 8px; }
.table::before { /* a ring left by a glass, because it's a coaster */
  content: ""; position: absolute; width: min(78vw, 330px); aspect-ratio: 1; border-radius: 50%; left: 50%; top: 50%;
  transform: translate(-38%, -58%); border: 10px solid var(--stain); filter: blur(1.5px); pointer-events: none; }
.coaster { position: relative; width: min(80vw, 340px); aspect-ratio: 1; perspective: 1200px; border: 0; padding: 0; background: none; cursor: pointer; color: inherit; transform: rotate(-4deg); transition: transform .3s; }
.coaster:hover { transform: rotate(-2deg) scale(1.01); }
.coaster .spin { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3, 1.4, .5, 1); }
.coaster.flipped .spin { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 50%; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden;
  background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.12), transparent 55%), var(--pulp);
  box-shadow: 0 1px 0 rgba(0,0,0,.25), 0 14px 28px rgba(0,0,0,.28), inset 0 0 0 2px rgba(0,0,0,.08); }
.face::before { /* the printed edge */ content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--edge);
  -webkit-mask: radial-gradient(circle closest-side, transparent calc(100% - 13px), #000 calc(100% - 12px)); mask: radial-gradient(circle closest-side, transparent calc(100% - 13px), #000 calc(100% - 12px)); }
.arc circle { fill: none; stroke: var(--print); }
.face svg.arc { position: absolute; inset: 0; width: 100%; height: 100%; }
.arc text { fill: var(--print); font-family: var(--ct-display, sans-serif); font-weight: 900; text-transform: uppercase; }
.front .pic { position: absolute; inset: 29%; border-radius: 50%; object-fit: cover; width: 42%; height: 42%; border: 3px solid var(--print); background: var(--chip); }
.front .pic.initials { display: grid; place-items: center; color: var(--print); font: 900 clamp(34px, 11vw, 56px)/1 var(--ct-display, sans-serif); background: transparent; }
.back { transform: rotateY(180deg); display: grid; place-items: center; text-align: center; color: var(--print); }
.back .inner { width: 56%; display: grid; gap: 6px; justify-items: center; }
.back .k { font: 800 11px/1 var(--ct-sans, sans-serif); letter-spacing: .18em; text-transform: uppercase; opacity: .8; }
.back .big { font: 900 clamp(18px, 5.8vw, 25px)/1.02 var(--ct-display, sans-serif); text-transform: uppercase; }
.back .sm { font-size: 13px; font-weight: 600; line-height: 1.3; }
.back .qr { width: 36%; aspect-ratio: 1; margin-top: 4px; background: var(--pulp); }
.back .qr svg { width: 100%; height: 100%; display: block; }
.tap { margin-top: 12px; font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .coaster, .coaster .spin { transition: none; } }

/* ---------- who ---------- */
.who { text-align: center; margin-top: 14px; }
h1 { font: 900 clamp(38px, 11vw, 56px)/1 var(--ct-display, sans-serif); margin: 0; letter-spacing: -.005em; }
.title { margin: 6px 0 0; color: var(--muted); font-weight: 600; }
.status { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; background: var(--chip); border-radius: 999px; padding: 6px 13px; font-size: 14px; font-weight: 600; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.bio { margin: 14px auto 0; white-space: pre-wrap; max-width: 46ch; }
.socials { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
.socials a { text-decoration: none; background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 600; }
.socials a:hover { border-color: var(--ink); }

/* ---------- buttons ---------- */
.links { display: grid; gap: 10px; margin-top: 20px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; text-decoration: none; font: 700 16px/1.2 var(--ct-sans, Inter, sans-serif);
  padding: 15px 16px; border-radius: 12px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; width: 100%; }
.btn:hover { background: var(--chip); }
.btn.main { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.main:hover { filter: brightness(1.07); background: var(--accent); }
.btn.sm { width: auto; padding: 9px 13px; font-size: 14px; border-radius: 9px; }
h2 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font: 800 26px/1.1 var(--ct-display, sans-serif); margin: 32px 0 12px; }
h2 small { font: 700 12px/1 var(--ct-sans, sans-serif); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* ---------- the Tape ---------- */
.frame { position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #000; border: 1.5px solid var(--ink); }
.frame img, .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border: 0; display: block; }
.frame .play { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(transparent 35%, rgba(0,0,0,.6)); border: 0; cursor: pointer; color: #fff; padding: 0; width: 100%; }
.frame .play span { background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 13px 22px; font: 700 16px/1 var(--ct-sans, sans-serif); box-shadow: 0 6px 18px rgba(0,0,0,.35); }
.frame .play:hover span { transform: scale(1.04); }
.cap { margin-top: 8px; font-size: 14px; color: var(--muted); }

/* ---------- dates as ticket stubs ---------- */
.dates { display: grid; gap: 12px; }
.stub { position: relative; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; display: grid; grid-template-columns: 74px minmax(0, 1fr); }
.stub::before, .stub::after { /* the notches where it tears */ content: ""; position: absolute; left: 66px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--line); }
.stub::before { top: -9px; } .stub::after { bottom: -9px; }
.cal { display: grid; place-content: center; text-align: center; border-right: 2px dashed var(--line); padding: 14px 6px; }
.cal b { display: block; font: 900 30px/1 var(--ct-display, sans-serif); }
.cal span { font: 800 11px/1.3 var(--ct-sans, sans-serif); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.cal .mo { color: var(--accent); }
.body { padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.where { min-width: 0; }
.where b { display: block; font-size: 17px; overflow-wrap: anywhere; }
.where .hint { color: var(--muted); font-size: 14px; }
.pill { font-size: 12px; font-weight: 800; padding: 5px 9px; border-radius: 6px; background: var(--chip); white-space: nowrap; letter-spacing: .02em; }
.pill.hot { background: var(--accent); color: var(--on-accent); }
.bill { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.bill > span { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 11px; }
.mini { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: 14px; }
.mini i { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--edge); padding: 3px; flex: none; }
.mini img, .mini em { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: var(--pulp); color: var(--print); display: grid; place-items: center; font: normal 800 10px/1 var(--ct-sans, sans-serif); }
.mini:hover span { text-decoration: underline; }

/* ---------- fan list ---------- */
.join { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 10px; }
.join p { margin: 0; color: var(--muted); }
.join input, .join select { width: 100%; font: 16px/1.3 var(--ct-sans, sans-serif); padding: 12px 13px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
.join .city { position: relative; }
.join ul { list-style: none; margin: 4px 0 0; padding: 4px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); position: absolute; left: 0; right: 0; z-index: 5; }
.join li button { width: 100%; text-align: left; background: none; border: 0; padding: 9px 10px; border-radius: 7px; font: inherit; color: var(--ink); cursor: pointer; }
.join li button:hover { background: var(--chip); }
.join .msg { font-weight: 600; }

/* ---------- foot ---------- */
.own { margin-top: 40px; text-align: center; border-top: 1.5px dashed var(--line); padding-top: 26px; }
.own b { display: block; font: 900 24px/1.1 var(--ct-display, sans-serif); }
.own p { margin: 6px 0 14px; color: var(--muted); }
.own .btn { display: inline-flex; width: auto; }
footer { text-align: center; margin-top: 24px; font-size: 13px; color: var(--muted); }
footer a { font-weight: 700; text-decoration: none; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; z-index: 9; }
.empty { text-align: center; padding: 80px 0; }
.empty p { color: var(--muted); }
@media (max-width: 380px) { .row2 { grid-template-columns: 1fr; } .stub { grid-template-columns: 62px minmax(0, 1fr); } .stub::before, .stub::after { left: 54px; } }
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"><div class="empty"><p>Loading…</p></div></main>
<div class="toast" id="toast" role="status" hidden></div>

<script src="/config.js"></script>
<script src="/sdk/csb.js"></script>
<script>
(function () {
  "use strict";
  var CFG = window.COMICTABLE_CONFIG || {};
  var CSB = window.CSB || {};
  var app = document.getElementById("app");
  var LOOKS = ["classic", "night", "redwood", "mustard", "spooky", "holiday"];
  // comictable.com/<id> (or ?c=<id> for testing)
  var id = decodeURIComponent((location.pathname.match(/^\/([a-z0-9][a-z0-9-]*)\/?$/i) || [])[1] || new URLSearchParams(location.search).get("c") || "").toLowerCase();
  var here = location.origin + "/" + id;

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    for (var k in (attrs || {})) { var v = attrs[k]; if (v === null || v === undefined || v === false) continue;
      if (k === "text") e.textContent = v; else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v); }
    [].concat(kids || []).forEach(function (c) { if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : String(c)); });
    return e;
  }
  var SVG = "http://www.w3.org/2000/svg";
  function svg(tag, attrs, kids) { var e = document.createElementNS(SVG, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); [].concat(kids || []).forEach(function (c) { e.append(c); }); return e; }
  function api(path, body) {
    return fetch(CFG.SUPABASE_URL + "/rest/v1/" + path, { method: body ? "POST" : "GET",
      headers: { apikey: CFG.SUPABASE_ANON_KEY, Authorization: "Bearer " + CFG.SUPABASE_ANON_KEY, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().catch(function () { return null; }).then(function (b) { if (!r.ok) throw new Error((b && b.message) || r.status); return b; }); });
  }
  var t0;
  function toast(msg) { var t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(t0); t0 = setTimeout(function () { t.hidden = true; }, 2400); }
  var safe = function (u) { return /^https:\/\//i.test(String(u || "").trim()) ? String(u).trim() : null; };
  var initials = function (n) { return String(n || "?").split(/\s+/).map(function (w) { return w[0] || ""; }).join("").slice(0, 2).toUpperCase(); };
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"], DAY = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  function niceTime(t) {
    var m = String(t || "").match(/^(\d{1,2}):(\d{2})/); if (!m) return t || "";
    var hh = +m[1], ap = hh >= 12 ? "pm" : "am"; hh = hh % 12 || 12; return hh + (m[2] === "00" ? "" : ":" + m[2]) + ap;
  }
  var dayOf = function (d) { return new Date(d.date + "T12:00:00"); };

  function notFound() {
    document.title = "Coaster not found · ComicTable";
    app.replaceChildren(el("div", { class: "empty" }, [el("h1", { text: "No one here yet" }), el("p", { text: "Check the link, or ask the comic to send it again." }),
      el("p", null, el("a", { class: "btn sm", href: "/#coaster", text: "Get your own Coaster" }))]));
  }
  if (!id || !CFG.SUPABASE_URL) return notFound();

  Promise.all([
    api("comics?select=*&id=eq." + encodeURIComponent(id)),
    api("rpc/comic_shows", { p_comic: id }).catch(function () { return []; }),
    api("rpc/also_on_bill", { p_comic: id }).catch(function () { return []; }),
    api("hosts?select=site_id,hidden&comic_id=eq." + encodeURIComponent(id)).catch(function () { return []; })
  ]).then(function (r) {
    var c = (r[0] || [])[0]; if (!c) return notFound();
    var dates = (r[1] || []).filter(function (d) { return d.status !== "cancelled"; });
    var onSites = (r[3] || []).filter(function (x) { return !x.hidden; }).map(function (x) { return x.site_id; });
    var sitesP = onSites.length ? api("sites?select=id,name,domain,features&id=in.(" + onSites.map(encodeURIComponent).join(",") + ")").catch(function () { return []; }) : Promise.resolve([]);
    return sitesP.then(function (sites) { draw(c, dates, r[2] || [], sites || []); });
  }).catch(function () {
    app.replaceChildren(el("div", { class: "empty" }, [el("h1", { text: "Couldn't load this" }), el("p", { text: "Check your connection and try again." })]));
  });

  // The name printed around the top of the coaster, ComicTable around the bottom.
  function arcText(top, bottom) {
    var size = top.length > 22 ? 13 : top.length > 16 ? 16 : 20;
    return svg("svg", { class: "arc", viewBox: "0 0 300 300", "aria-hidden": "true" }, [
      // rings: just inside the striped rim, and around the middle
      svg("circle", { cx: 150, cy: 150, r: 133, "stroke-width": 2 }), svg("circle", { cx: 150, cy: 150, r: 99, "stroke-width": 1.5 }),
      svg("defs", {}, [svg("path", { id: "arcTop", d: "M 39 150 A 111 111 0 0 1 261 150", fill: "none" }), svg("path", { id: "arcBot", d: "M 34 150 A 116 116 0 0 0 266 150", fill: "none" })]),
      svg("text", { "font-size": size, "letter-spacing": "3", "text-anchor": "middle" }, svg("textPath", { href: "#arcTop", startOffset: "50%" }, document.createTextNode(top))),
      svg("text", { "font-size": "11", "letter-spacing": "4", "text-anchor": "middle" }, svg("textPath", { href: "#arcBot", startOffset: "50%" }, document.createTextNode(bottom)))]);
  }
  // A QR code back to this Coaster (made in the browser; the maker loads only when the coaster is flipped).
  var qrLoad = null;
  function qrInto(box, text) {
    qrLoad = qrLoad || new Promise(function (ok, no) {
      if (window.qrcode) return ok(window.qrcode);
      var s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
      s.onload = function () { window.qrcode ? ok(window.qrcode) : no(); }; s.onerror = function () { qrLoad = null; no(); }; document.head.append(s);
    });
    qrLoad.then(function (make) {
      var q = make(0, "M"); q.addData(text); q.make(); var n = q.getModuleCount(), d = "";
      for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) d += "M" + c + " " + r + "h1v1h-1z";
      box.replaceChildren(svg("svg", { viewBox: "-2 -2 " + (n + 4) + " " + (n + 4), role: "img", "aria-label": "QR code to this page", "shape-rendering": "crispEdges" }, svg("path", { d: d, fill: "currentColor" })));
    }, function () { box.replaceChildren(); });
  }

  function draw(c, dates, bill, sites) {
    var look = LOOKS.indexOf(c.look) >= 0 ? c.look : "classic";
    document.body.className = "look-" + look;
    document.title = c.name + " · ComicTable";
    var parts = [], next = dates[0];

    // ---- the coaster ----
    var front = el("div", { class: "face front" }, [arcText(c.name, "★ ComicTable ★ Coaster ★"),
      safe(c.photo_url) ? el("img", { class: "pic", src: c.photo_url, alt: "" }) : el("div", { class: "pic initials", text: initials(c.name) })]);
    var qr = el("div", { class: "qr" });
    var back = el("div", { class: "face back" }, [arcText(next ? "Next up" : "Scan me", "comictable.com/" + c.id),
      el("div", { class: "inner" }, next ? [
        el("span", { class: "k", text: DAY[dayOf(next).getDay()] + " " + MON[dayOf(next).getMonth()] + " " + dayOf(next).getDate() + (next.time ? " · " + niceTime(next.time) : "") }),
        el("span", { class: "big", text: next.venue || next.site_name || "Show" }), next.city ? el("span", { class: "sm", text: next.city }) : null, qr]
        : [el("span", { class: "big", text: c.name }), el("span", { class: "sm", text: c.title || "Comedian" }), qr])]);
    var coaster = el("button", { class: "coaster", type: "button", "aria-label": c.name + "'s Coaster. Flip it over", "aria-pressed": "false", onclick: function () {
      var f = coaster.classList.toggle("flipped"); coaster.setAttribute("aria-pressed", String(f)); tap.textContent = f ? "Tap to flip back" : "Tap the coaster to flip it";
      if (f && !qr.firstChild) qrInto(qr, here);
    } }, el("div", { class: "spin" }, [front, back]));
    var tap = el("div", { class: "tap", text: "Tap the coaster to flip it" });
    parts.push(el("section", { class: "table" }, [coaster, tap]));

    // ---- who ----
    var so = CSB.socialsOf ? CSB.socialsOf(c) : {};
