<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ComicTable</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">

<script>
  // Theme before anything draws, so there's no flash: "light", "dark", or follow the computer.
  try { var t = localStorage.getItem("ct_theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<style>
/* Layout: sticky sidebar + one working column. Each section: a friendly "do the thing" card on top, the live list below. Phones get a top tab row and full-width cards. */
:root {
  /* Light: the brand's ivory, charcoal and redwood, kept quiet for daily work */
  --bg: #f6f3ec;
  --panel: #ffffff;
  --side: #fbf9f4;
  --line: #e7e1d5;
  --line-strong: #d6cebf;
  --text: #1f1f1f;
  --muted: #67625a;
  --accent: #c4452e;
  --accent-ink: #ffffff;
  --accent-soft: #f8e4de;
  --brand-red: #c4452e;
  --mustard: #e0a21a;
  --ok: #15803d;
  --ok-soft: #e7f6ec;
  --warn: #8a5a00;
  --warn-soft: #fbf0d6;
  --focus: #1f1f1f;
  --shadow: 0 1px 2px rgba(16, 16, 20, .04), 0 1px 1px rgba(16, 16, 20, .03);
  --display: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 12px;
  color-scheme: light;
}
/* Dark: neutral grays, the traditional kind */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141414; --panel: #1c1c1c; --side: #171717; --line: #2a2a2a; --line-strong: #383838; --text: #edeae4; --muted: #a3a3a3;
    --accent: #e66a4b; --accent-ink: #161616; --accent-soft: #3a1f19; --brand-red: #e0583b; --ok: #4ac26b; --ok-soft: #142a1b; --warn: #e0a21a; --warn-soft: #2e2512; --focus: #f3ead7;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141414; --panel: #1c1c1c; --side: #171717; --line: #2a2a2a; --line-strong: #383838; --text: #edeae4; --muted: #a3a3a3;
  --accent: #e66a4b; --accent-ink: #161616; --accent-soft: #3a1f19; --brand-red: #e0583b; --ok: #4ac26b; --ok-soft: #142a1b; --warn: #e0a21a; --warn-soft: #2e2512; --focus: #f3ead7;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14.5px/1.5 var(--sans); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
a { color: var(--focus); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3, .brand { font-family: var(--display); letter-spacing: -.02em; font-weight: 650; }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { font-weight: 650; font-size: 16px; padding: 2px 10px 2px; }
.ct-mark { color: var(--text); display: inline-block; }
.ct-mark .wm { height: 15px; }
.ct-mark.sm .wm { height: 13px; }
.brand-sub { font-size: 12px; color: var(--muted); padding: 0 10px 14px; }
.site-pick { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; background: none; border: 1px solid var(--line); border-radius: 12px; padding: 8px 4px 8px 0; cursor: pointer; color: var(--text); font: inherit; }
.site-pick:hover { border-color: var(--line-strong, #cfc9c0); background: var(--bg); }
.site-pick .sp-txt { display: grid; min-width: 0; flex: 1; }
.site-pick .brand, .site-pick .brand-sub { padding: 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.site-pick .sp-arrow { font-size: 18px; color: var(--muted); padding-right: 8px; }
.back-ct { display: block; font-size: 13px; font-weight: 600; color: var(--muted); text-decoration: none; padding: 2px 10px 10px; }
.back-ct:hover { color: var(--text); }
.ct-brand { color: var(--text); padding: 6px 10px 4px; display: block; }
.wm { display: block; height: 22px; width: auto; }
.ct-brand .wm { height: 21px; }
.site-pick.open-site { margin-top: 4px; }
.side-foot .acct-link { color: inherit; text-decoration: none; }
.side-foot .acct-link:hover { text-decoration: underline; }
.sp-hint { font-size: 11px; color: var(--muted); padding: 6px 10px 12px; }
.sp-wrap { position: fixed; inset: 0; background: rgba(20, 18, 16, .35); display: grid; justify-items: center; align-items: start; padding: 10vh 16px 16px; z-index: 50; }
.sp-box { width: 100%; max-width: 560px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 20px 60px -20px rgba(0,0,0,.45); overflow: hidden; display: grid; }
.sp-box > input { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; font-size: 18px; padding: 16px 18px; background: var(--panel); }
.sp-box > input:focus { outline: none; box-shadow: none; }
.sp-list { max-height: min(60vh, 520px); overflow-y: auto; padding: 6px; }
.sp-group { font-size: 11px; font-weight: 700; color: var(--muted); padding: 10px 12px 4px; letter-spacing: .02em; }
.sp-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; border-radius: 10px; padding: 10px 12px; cursor: pointer; color: var(--text); font: inherit; }
.sp-item .hint { margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.sp-item[aria-selected="true"] { background: var(--accent-soft, #fde8e6); }
.sp-foot { border-top: 1px solid var(--line); padding: 8px 14px; font-size: 12px; }
.nav-btn { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 7px 10px; cursor: pointer; color: var(--muted); font-weight: 500; }
.nav-btn .ico { width: 20px; text-align: center; }
.nav-btn .cnt { margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; }
.nav-btn:hover { background: var(--bg); color: var(--text); }
.nav-group { font-size: 12px; font-weight: 500; color: var(--muted); padding: 16px 10px 4px; }
.nav-group.nav-sep { padding: 6px 0; }
.chatfeed { height: 420px; max-height: 60vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; padding: 6px; background: var(--bg); display: grid; align-content: start; gap: 2px; }
.chatline { display: flex; justify-content: space-between; gap: 10px; align-items: start; padding: 7px 9px; border-radius: 9px; background: var(--panel); }
.chatline.gone { opacity: .45; }
.chatline .btns { flex: none; }
.nav-btn[aria-current="page"] { background: var(--panel); color: var(--text); box-shadow: 0 0 0 1px var(--line), var(--shadow); }
.nav-btn[aria-current="page"] .ico { color: var(--accent); }
.nav-btn .ico svg { width: 17px; height: 17px; display: block; }
.side-foot { margin-top: auto; display: grid; gap: 6px; padding: 12px 10px 4px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
.side-foot .links { display: flex; gap: 12px; flex-wrap: wrap; }

main { padding: 28px max(24px, env(safe-area-inset-right, 0px)) 80px 28px; min-width: 0; max-width: 1120px; width: 100%; }
.page-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
h1 { font-size: 30px; margin: 0; line-height: 1.1; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 64ch; }
.stack { display: grid; gap: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; box-shadow: var(--shadow); }
.card > h2 { font-size: 18px; margin: 0 0 4px; }
.card > .sub { margin: 0 0 14px; font-size: 14px; }
.step { display: grid; gap: 8px; padding: 14px 0; border-top: 1px dashed var(--line); }
.step:first-of-type { border-top: 0; padding-top: 4px; }
.step-label { font-weight: 700; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.step-num { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; }

.grid { display: grid; gap: 10px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.c2 { grid-column: span 2; } .c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c9 { grid-column: span 9; } .c12 { grid-column: span 12; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--muted); }
input, select, textarea { width: 100%; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px; padding: 9px 11px; min-width: 0; min-height: 40px; }
textarea { resize: vertical; min-height: 80px; }
input:focus, select:focus, textarea:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent); }
input.bad, select.bad { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
input[type=checkbox] { width: auto; min-height: 0; }

.btn { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 8px; padding: 8px 14px; font-weight: 550; box-shadow: var(--shadow); cursor: pointer; white-space: nowrap; min-height: 40px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: inherit; }
.btn:hover { background: var(--bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.big { padding: 12px 22px; font-size: 16px; border-radius: 12px; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--bg); }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; min-height: 32px; }
.btn.danger { color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-strong); border-radius: 12px; padding: 3px; gap: 3px; background: var(--bg); max-width: 100%; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 7px 13px; font-weight: 650; cursor: pointer; color: var(--muted); min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.14); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 13px; }
.chip:hover { border-color: var(--accent); color: var(--accent); }

/* club search */
.combo { position: relative; }
.combo-list { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,.14); padding: 4px; max-height: 320px; overflow-y: auto; }
.combo-item { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 9px 10px; cursor: pointer; }
.combo-item[aria-selected="true"], .combo-item:hover { background: var(--accent-soft); }
.combo-item small { color: var(--muted); }
.combo-item.new { color: var(--accent); font-weight: 700; }
.picked { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--ok-soft); border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent); border-radius: 12px; padding: 10px 12px; }
.picked b { font-size: 16px; }
.newclub { background: var(--bg); border-radius: 12px; padding: 12px; }

/* calendar */
.cal-wrap { display: flex; gap: 18px; flex-wrap: wrap; }
.cal { width: 300px; max-width: 100%; }
.cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-weight: 700; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-dow { font-size: 11px; color: var(--muted); text-align: center; font-weight: 700; padding: 2px 0; }
.day { aspect-ratio: 1; border: 0; background: none; border-radius: 10px; cursor: pointer; font-weight: 600; position: relative; font-variant-numeric: tabular-nums; min-height: 0; }
.day:hover { background: var(--bg); }
.day[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.day:disabled { color: var(--line-strong); cursor: default; background: none; }
.day.today { box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.day .dot { position: absolute; bottom: 4px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--ok); }
.day[aria-pressed="true"] .dot { background: var(--accent-ink); }

/* show grid */
.slots { display: grid; gap: 6px; }
.slot-day { font-weight: 700; font-size: 13px; padding: 8px 0 2px; display: flex; justify-content: space-between; align-items: center; }
.slot { display: grid; grid-template-columns: 128px minmax(0, 1fr) 140px auto; gap: 8px; align-items: center; }
.paste { background: var(--bg); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.note-ok { color: var(--ok); font-weight: 600; font-size: 13px; }
.hint { font-size: 13px; color: var(--muted); }
.err { color: var(--accent); font-weight: 650; font-size: 14px; }
.kbd { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--line-strong); border-radius: 5px; padding: 1px 6px; }

/* tables */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.toolbar .search { max-width: 260px; }
.check { display: inline-flex; gap: 7px; align-items: center; color: var(--muted); font-size: 14px; cursor: pointer; }
.tablewrap { overflow-x: auto; margin: 0 -18px -18px; border-top: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.past td { color: var(--muted); }
tr.editing td { background: var(--warn-soft); vertical-align: top; }
tr.month td { background: var(--bg); font-size: 12px; font-weight: 800; color: var(--muted); padding: 7px 12px; text-transform: uppercase; letter-spacing: .05em; }
td.actions { text-align: right; white-space: nowrap; width: 1%; }
.nowrap { white-space: nowrap; }
.wrap-any { overflow-wrap: anywhere; }
td select.status { min-height: 32px; padding: 4px 8px; width: auto; font-size: 13px; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 9px; background: var(--bg); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.red { background: var(--accent-soft); color: var(--accent); }
.empty { padding: 34px 12px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--text); font-family: var(--display); font-size: 18px; margin-bottom: 4px; }

/* dashboard */
.hello { font-size: 28px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
.stat .n { font-family: var(--display); font-size: 28px; font-weight: 650; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .l { color: var(--muted); font-size: 13px; margin-top: 4px; }
.next { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.next .date-badge { width: 64px; height: 64px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; text-align: center; line-height: 1; flex: none; }
.next .date-badge b { font-family: var(--display); font-size: 26px; display: block; }
.next .date-badge small { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
.todo { display: grid; gap: 8px; }
.todo-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; background: var(--warn-soft); border-radius: 10px; }

/* media & people */
.vids { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.vid { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); display: grid; }
.vid img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: var(--bg); }
.vid .body { padding: 10px 12px; display: grid; gap: 6px; }
.vid.hidden img { opacity: .35; }
.comic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 14px; }
.comic-card { display: grid; grid-template-columns: 52px minmax(0, 1fr); grid-template-rows: auto auto; gap: 4px 12px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; cursor: pointer; color: var(--text); font: inherit; box-shadow: var(--shadow); }
.comic-card:hover { border-color: var(--line-strong); }
.comic-card .avatar { width: 52px; height: 52px; grid-row: span 2; }
.comic-card .cc-body { display: grid; gap: 2px; min-width: 0; }
.comic-card .cc-chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.comic-card .cc-meta { grid-column: 2; display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.avatar.initials { display: grid; place-items: center; font-weight: 600; font-size: 15px; color: var(--muted); background: var(--bg); }
.detail-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .detail-grid { grid-template-columns: 1fr; } }
.snippet { background: var(--text); color: var(--bg); border-radius: 10px; padding: 12px 14px; font: 500 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-x: auto; margin: 0; white-space: pre; }
.post-preview { border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; line-height: 1.6; min-height: 200px; }
.post-preview img { max-width: 100%; border-radius: 8px; }
.post-preview .csb-video iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 8px; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
.person-top { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
.avatar { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; background: var(--bg); border: 1px solid var(--line); flex: none; display: grid; place-items: center; color: var(--muted); font-size: 11px; text-align: center; }
form.card.is-hidden { opacity: .7; }
.merch-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.merch-row:first-child { border-top: 0; }
.merch-row img, .merch-row .ph { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: var(--bg); }

.switches { display: grid; gap: 4px; }
.switch-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.switch-row:first-child { border-top: 0; }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; width: 100%; height: 100%; z-index: 1; }
.switch span { position: absolute; inset: 0; background: var(--line-strong); border-radius: 999px; transition: background .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked + span { background: var(--ok); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }

.thread { border-bottom: 1px solid var(--line); padding: 12px 0; display: grid; gap: 8px; }
.thread:last-child { border-bottom: 0; }
.thread-head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.post { background: var(--bg); border-radius: 10px; padding: 8px 10px; display: flex; justify-content: space-between; gap: 10px; }
.post p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }

.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }

.toast { position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 12px; display: flex; gap: 14px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.25); z-index: 60; max-width: calc(100% - 32px); font-weight: 600; }

.toast button { background: none; border: 0; color: inherit; font-weight: 800; text-decoration: underline; cursor: pointer; padding: 0; }

@media (max-width: 880px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px max(12px, env(safe-area-inset-left, 0px)) 8px; gap: 4px; }

  .c2, .c3, .c4, .c5, .c6, .c7, .c8, .c9 { grid-column: span 12; }

  .slot .url { grid-column: 1 / -1; grid-row: 2; }
  .slot .rm { grid-column: 3; grid-row: 1; }
  h1 { font-size: 26px; } .hello { font-size: 28px; }
  .cal { width: 100%; }
}
/* add-shows panel */
.drawer-wrap { position: fixed; inset: 0; z-index: 50; }
.drawer-backdrop { position: absolute; inset: 0; background: rgba(20, 16, 12, .38); }
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); box-shadow: -12px 0 40px rgba(0,0,0,.18);
  display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px 6px; }
.drawer-head h2 { margin: 0; font-size: 24px; }
.drawer-body { overflow-y: auto; padding: 14px 22px 22px; }

.drawer-foot .btn.primary { margin-left: auto; }
.steps { display: flex; gap: 6px; list-style: none; margin: 0; padding: 6px 22px 10px; border-bottom: 1px solid var(--line); }
.steps li { flex: 1; }
.steps button { width: 100%; display: flex; align-items: center; gap: 7px; background: none; border: 0; padding: 6px 0; font-weight: 650; font-size: 13px; color: var(--muted); cursor: pointer; text-align: left; border-bottom: 3px solid var(--line); }
.steps button:disabled { cursor: default; }
.steps li.on button { color: var(--text); border-bottom-color: var(--accent); }
.steps li.done button { color: var(--ok); border-bottom-color: var(--ok); }
.dotnum { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--bg); flex: none; }
.steps li.on .dotnum { background: var(--accent); color: var(--accent-ink); }
.steps li.done .dotnum { background: var(--ok); color: #fff; }
.run-summary { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--bg); border-radius: 12px; padding: 10px 12px; }
.chip.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
details.quiet > summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.drawer .cal { width: 100%; max-width: 360px; }
.drawer .slot { grid-template-columns: 148px minmax(0, 1fr) auto; }
.drawer .slot input[type=time] { min-width: 0; }
/* row menu */
details.menu { position: relative; display: inline-block; }
details.menu > summary { list-style: none; }
details.menu > summary::-webkit-details-marker { display: none; }
.menu-pop { position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,.16); padding: 4px; min-width: 240px; display: grid; }
.menu-pop button { background: none; border: 0; text-align: left; padding: 9px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.menu-pop button:hover { background: var(--bg); }
.menu-pop button.danger { color: var(--accent); }
td select.status.st-sold_out, td select.status.st-cancelled { color: var(--accent); }
td select.status.st-few_left { color: var(--warn); }
@media (min-width: 881px) { .app { background: linear-gradient(90deg, var(--panel) 236px, transparent 236px); } }
/* phones: table rows become stacked cards */
@media (max-width: 640px) {
  .tablewrap { overflow-x: visible; }
  .tablewrap thead { display: none; }
  .tablewrap tbody tr { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 4px 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); align-items: start; }

  .tablewrap tbody td { display: block; border: 0; padding: 0; min-width: 0; }
  .tablewrap tbody td:empty { display: none; }
  .tablewrap tbody td.actions { grid-column: 1 / -1; text-align: left; width: auto; margin-left: -10px; }
  .tablewrap tbody tr.editing { grid-template-columns: 1fr; }
  .tablewrap tbody tr.editing td { padding: 2px 0; }
  .wrap-any { overflow-wrap: break-word; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.order-list { display: grid; gap: 6px; margin-top: 10px; }
.order-row { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card, transparent); }
.order-row.off b { opacity: .55; }
.set-head { padding-top: 18px; } .set-head h2 { margin: 0; } .set-head .hint { margin: 4px 0 0; }
.set-order { padding: 12px 0; border-bottom: 1px solid var(--line); }
.share-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 380px); gap: 18px; align-items: start; }
@media (max-width: 760px) { .share-wrap { grid-template-columns: 1fr; } }
.share-card { display: grid; gap: 4px; padding: 12px 14px; border-radius: 8px; background: #2b2d31; color: #dbdee1; border-left: 4px solid #1e1f22; font-size: 14px; min-width: 0; }
.share-host { font-size: 12px; color: #b5bac1; }
.share-title { color: #00a8fc; font-size: 15px; overflow-wrap: anywhere; }
.share-text { line-height: 1.4; overflow-wrap: anywhere; }
.share-img { margin-top: 8px; width: 100%; aspect-ratio: 1.91 / 1; object-fit: cover; border-radius: 6px; background: #1e1f22; }
.share-img.none { display: grid; place-items: center; text-align: center; padding: 12px; font-size: 12px; color: #949ba4; }
</style>

<body>
<div id="root"><div class="login-wrap"><p>Loading…</p></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<canvas id="confetti" hidden></canvas>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="sdk/csb.js"></script>
<script>
(() => {
  "use strict";
  const CFG = window.COMICTABLE_CONFIG || window.COCKFIGHT_CONFIG || {};
  const root = document.getElementById("root");
  const $ = (id) => document.getElementById(id);

  /* ============ DOM helper ============ */
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k === "value") e.value = v;
      else if (k === "checked") e.checked = !!v;
      else if (k === "selected") e.selected = !!v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat(Infinity)) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : String(c));
    return e;
  }
  const field = (label, input, cls) => h("label", { class: "field " + (cls || "") }, h("span", { text: label }), input);
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

  /* ============ feedback ============ */
  let toastTimer;
  function toast(msg, opts = {}) {
    const t = $("toast"); t.textContent = ""; t.className = "toast" + (opts.bad ? " bad" : "");
    t.append(h("span", { text: msg }));
    if (opts.action) t.append(h("button", { type: "button", text: opts.action.label, onclick: () => { t.hidden = true; opts.action.run(); } }));
    t.hidden = false; clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, opts.action ? 7000 : 3200);
  }
  function errText(e) {
    const m = (e && (e.message || e.error_description)) || String(e);
    if (/row-level security|permission denied|42501/i.test(m)) return "Not allowed. Your login isn't an admin of this site, or a database setup step was skipped.";
    if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Couldn't reach the database. Check your connection and try again.";
    if (/duplicate key|23505/i.test(m)) return "That already exists.";
    return m;
  }
  function confetti() {
    if (matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const c = $("confetti"), ctx = c.getContext && c.getContext("2d"); if (!ctx) return;
    c.hidden = false; c.width = innerWidth; c.height = innerHeight;
    const colors = ["#d6302a", "#ffb627", "#2a7d2e", "#00a6a6", "#ff4fd8"];
    const bits = Array.from({ length: 90 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 160, y: innerHeight * .65, vx: (Math.random() - .5) * 11, vy: -Math.random() * 13 - 6, r: Math.random() * 6 + 3, c: colors[Math.floor(Math.random() * colors.length)], a: Math.random() * 6 }));
    let f = 0;
    (function tick() {
      ctx.clearRect(0, 0, c.width, c.height);
      for (const b of bits) { b.x += b.vx; b.y += b.vy; b.vy += .45; b.a += .2; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a); ctx.fillStyle = b.c; ctx.fillRect(-b.r / 2, -b.r / 2, b.r, b.r * .6); ctx.restore(); }
      if (++f < 90) requestAnimationFrame(tick); else { ctx.clearRect(0, 0, c.width, c.height); c.hidden = true; }
    })();
  }

  /* ============ dates & times ============ */
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const MONTH_FULL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const today = () => iso(new Date());
  const parseISO = (s) => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
  const niceDate = (s) => { if (!s) return ""; const d = parseISO(s); return DOW[d.getDay()] + " " + MON[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); };
  const shortDate = (s) => { const d = parseISO(s); return DOW[d.getDay()] + " " + MON[d.getMonth()] + " " + d.getDate(); };
  const monthLabel = (s) => { const d = parseISO(s); return MONTH_FULL[d.getMonth()] + " " + d.getFullYear(); };
  function to12(t) { if (!t) return null; const [H, M] = t.split(":").map(Number); if (isNaN(H)) return t; return ((H % 12) || 12) + ":" + pad(M || 0) + " " + (H >= 12 ? "PM" : "AM"); }
  function to24(t) {
    if (!t) return ""; const m = String(t).match(/(\d{1,2})(?::(\d{2}))?\s*([ap])?/i); if (!m) return "";
    let H = +m[1]; const M = +(m[2] || 0), ap = (m[3] || "").toLowerCase();
    if (ap === "p" && H < 12) H += 12; if (ap === "a" && H === 12) H = 0;
    if (!ap && H >= 1 && H <= 11) H += 12; // comedy shows are evenings unless it says AM
    return pad(H) + ":" + pad(M);
  }
  const DEFAULT_TIMES = { 0: ["19:00"], 1: ["20:00"], 2: ["20:00"], 3: ["20:00"], 4: ["19:30"], 5: ["19:00", "21:30"], 6: ["19:00", "21:30"] };

  // Pull dates + times out of pasted text like "Fri Nov 6  7:00 PM, 9:30 PM" or "11/6 7pm & 9:30pm".
  function parseShowtimes(textIn) {
    const now = new Date(); now.setHours(0, 0, 0, 0);
    const monIdx = (s) => MONTH_FULL.findIndex((m) => m.toLowerCase().startsWith(s.toLowerCase().slice(0, 3)));
    const dateRe = /\b(?:(?:mon|tue|wed|thu|fri|sat|sun)[a-z]*\.?,?\s+)?(?:(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s+(\d{4}))?|(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?)/gi;
    const timeRe = /\b(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?|am|pm|a|p)\b|\b(\d{1,2}):(\d{2})\b/gi;
    const out = new Map(); let cur = null;
    const lines = String(textIn).split(/\n+/);
    for (const line of lines) {
      let rest = line, m; dateRe.lastIndex = 0;
      const found = [];
      while ((m = dateRe.exec(line))) found.push(m);
      if (found.length) {
        // each date takes the times written after it, up to the next date
        found.forEach((fm, i) => {
          let mo, da, yr;
          if (fm[1]) { mo = monIdx(fm[1]); da = +fm[2]; yr = fm[3] ? +fm[3] : null; } else { mo = +fm[4] - 1; da = +fm[5]; yr = fm[6] ? (+fm[6] < 100 ? 2000 + +fm[6] : +fm[6]) : null; }
          if (mo < 0 || mo > 11 || da < 1 || da > 31) return;
          let d = new Date(yr || now.getFullYear(), mo, da);
          if (!yr && d < new Date(now.getFullYear(), now.getMonth() - 1, now.getDate())) d = new Date(now.getFullYear() + 1, mo, da);
          cur = iso(d); if (!out.has(cur)) out.set(cur, []);
          const seg = line.slice(fm.index + fm[0].length, found[i + 1] ? found[i + 1].index : undefined);
          addTimes(seg, cur);
        });
      } else if (cur) addTimes(rest, cur);
    }
    function addTimes(seg, day) {
      let t; timeRe.lastIndex = 0;
      while ((t = timeRe.exec(seg))) {
        const hh = +(t[1] || t[4]), mm = +(t[2] || t[5] || 0), ap = (t[3] || "").replace(/\./g, "").toLowerCase();
        if (hh > 12 && !ap) { out.get(day).push(pad(hh) + ":" + pad(mm)); continue; }
        if (hh < 1 || hh > 12) continue;
        const v = to24(hh + ":" + pad(mm) + (ap ? " " + ap[0] : ""));
        if (v && !out.get(day).includes(v)) out.get(day).push(v);
      }
    }
    return [...out.entries()].map(([date, times]) => ({ date, times: times.sort() })).sort((a, b) => a.date.localeCompare(b.date));
  }
  window.__parseShowtimes = parseShowtimes; // handy for checking in the console

  /* ============ connection ============ */
  if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY || !window.supabase) {
    root.replaceChildren(h("div", { class: "login-wrap" }, h("div", { class: "card login" }, h("h1", { text: "Not connected" }), h("p", { class: "sub", text: "This page is missing its database connection details." }))));
    return;
  }
  const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  const S = { site: null, sites: [], hosts: [], shows: [], episodes: [], videos: [], merch: [], venues: [], sources: [], settings: {}, slotCache: {}, isPlatform: false, user: "", token: "" };
  const F = (k) => !!(S.site && S.site.features && S.site.features[k]);
  // A show with no single comic is a show event by the whole site (a live podcast, say).
  const EVENT = "*whole-show*";
  const hostName = (id) => !id || id === EVENT ? "The whole show" : (S.hosts.find((x) => x.id === id) || {}).name || id;
  const first = (id) => !id || id === EVENT ? "Whole show" : hostName(id).split(" ")[0];
  const siteName = (id) => (S.sites.find((x) => x.id === id) || {}).name || "another site";
  const venueById = (id) => S.venues.find((v) => v.id === id);
  const venueCity = (v) => (v.state ? v.city + ", " + v.state : v.city);
  async function q(p) { const r = await p; if (r.error) throw r.error; return r.data; }
  const sid = () => S.site.id;
  // Usernames become user@<site's domain>; anyone can also log in with a full email.
  const LOGIN_DOMAINS = [CFG.LOGIN_DOMAIN || "comictable.com", ...(CFG.OLDER_LOGIN_DOMAINS || ["cockfightpodcast.com"])].filter((d, i, a) => d && a.indexOf(d) === i);
  const loginDom = () => LOGIN_DOMAINS[0];

  // Every date and video of every comic on this site, wherever it was added. Falls back to this site's own rows
  // until the database has 11_comics.sql.
  async function loadShows(site) {
    const r = await sb.rpc("site_shows", { p_site: site, p_all: true });
    if (!r.error && Array.isArray(r.data)) return r.data;
    return q(sb.from("shows").select("*").eq("site_id", site).order("date", { ascending: true }));
  }
  async function loadVideos(site) {
    const r = await sb.rpc("site_videos", { p_site: site, p_all: true });
    if (!r.error && Array.isArray(r.data)) return r.data.map((v) => ({ ...v, hidden: !!v.hidden_here }));
    return q(sb.from("videos").select("*").eq("site_id", site).order("published", { ascending: false }));
  }
  // This site's feeds and channels, plus the channels its comics connected on their other sites.
  async function loadSources(site) {
    const own = await q(sb.from("sources").select("*").eq("site_id", site));
    const comics = [...new Set((await q(sb.from("hosts").select("comic_id").eq("site_id", site))).map((x) => x.comic_id).filter(Boolean))];
    if (!comics.length) return own;
    const r = await sb.from("sources").select("*").in("comic_id", comics).neq("site_id", site);
    return own.concat(r.error ? [] : r.data || []);
  }
  const hostComic = (id) => (S.hosts.find((x) => x.id === id) || {}).comic_id || null;
  const crew = () => S.hosts.filter((x) => !x.hidden && x.comic_id).map((x) => x.comic_id);

  // Which people on this site have their own login (comics.user_id)
  async function loadLogins() {
    S.logins = {};
    const ids = S.hosts.map((x) => x.comic_id).filter(Boolean);
    if (!ids.length) return;
    try { (await q(sb.from("comics").select("id, user_id").in("id", ids))).forEach((c) => { S.logins[c.id] = c.user_id || null; }); } catch (e) {}
  }

  async function loadAll() {
    const site = sid();
    const [hosts, shows, episodes, videos, merch, venues, sources, settings] = await Promise.all([
      q(sb.from("hosts").select("*").eq("site_id", site).order("sort", { ascending: true })),
      loadShows(site),
      q(sb.from("episodes").select("*").eq("site_id", site).order("num", { ascending: false })),
      loadVideos(site),
      q(sb.from("merch").select("*").eq("site_id", site).order("sort", { ascending: true })),
      q(sb.from("venues").select("*").order("name", { ascending: true })),
      loadSources(site),
      q(sb.from("settings").select("*").eq("site_id", site))
    ]);
    Object.assign(S, { hosts, shows, episodes, videos, merch, venues, sources, settings: Object.fromEntries(settings.map((r) => [r.key, r.value])) });
    await loadLogins();
  }
  const reload = {
    shows: async () => { S.shows = await loadShows(sid()); },
    episodes: async () => { S.episodes = await q(sb.from("episodes").select("*").eq("site_id", sid()).order("num", { ascending: false })); },
    videos: async () => { S.videos = await loadVideos(sid()); },
    merch: async () => { S.merch = await q(sb.from("merch").select("*").eq("site_id", sid()).order("sort", { ascending: true })); },
    venues: async () => { S.venues = await q(sb.from("venues").select("*").order("name", { ascending: true })); },
    sources: async () => { S.sources = await loadSources(sid()); },
    hosts: async () => { S.hosts = await q(sb.from("hosts").select("*").eq("site_id", sid()).order("sort", { ascending: true })); await loadLogins(); }
  };

  /* ============ addresses ============ */

      const owner = res.you_are === "owner";
      const user = h("input", { id: "teamUser", placeholder: "username or email", autocapitalize: "none", "aria-label": "Username or email" });
      const pass = h("input", { id: "teamPass", type: "text", placeholder: "at least 8 characters", "aria-label": "Starting password" });
      const role = h("select", { "aria-label": "Role", style: "width:auto" }, h("option", { value: "editor", text: "Editor: can edit everything" }), h("option", { value: "owner", text: "Owner: can also manage the team" }));
      const msg = h("div", { class: "err" });
      card.replaceChildren(h("h2", { text: "Team" }), h("p", { class: "sub", text: "Who can log in to this admin." }),
        h("div", null, res.team.map((m) => h("div", { class: "switch-row" },
          h("div", null, h("b", { text: LOGIN_DOMAINS.reduce((e, d) => e.replace("@" + d, ""), m.email) }), m.you ? h("span", { class: "pill", style: "margin-left:6px", text: "You" }) : null,
            h("div", { class: "hint", text: (m.role === "owner" ? "Owner" : "Editor") + (m.last_sign_in ? " · last in " + ago(m.last_sign_in) : " · hasn't logged in yet") })),
          owner && !m.you ? sure("Remove", async () => { try { await teamCall({ action: "remove", user_id: m.user_id }); toast("Removed from the team."); draw(); } catch (e) { toast(e.message, { bad: true }); } }) : null))),
        owner ? h("div", { class: "newclub stack", style: "gap:10px;margin-top:12px" }, h("b", { text: "Add someone" }),
          h("div", { class: "grid" }, field("Username or email", user, "c6"), field("Starting password", pass, "c6"), h("div", { class: "field c12" }, h("span", { text: "Access" }), role)),
          h("div", { class: "hint", text: "Send them their username and password yourself. If they already have a login, the password is ignored." }), msg,
          h("div", { class: "btns" }, h("button", { class: "btn primary sm", type: "button", text: "Add to team", onclick: async (e) => {
            msg.textContent = "";
            if (!user.value.trim()) { user.classList.add("bad"); user.focus(); return; }
            const b = e.currentTarget; b.disabled = true;
            try { await teamCall({ action: "add", email: loginEmail(user.value), password: pass.value, role: role.value }); const em = loginEmail(user.value); toast("Added. They log in with " + em + "."); draw(); }
            catch (er) { msg.textContent = er.message; b.disabled = false; }
          } }))) : h("p", { class: "hint", text: "Only owners can add or remove people." }));
    }
    draw(); return card;
  }
  /* ======================================================
     ALL SITES (platform admins only)
     ====================================================== */
  const cleanDomain = (d) => String(d || "").trim().toLowerCase().replace(/^https?:\/\//, "").replace(/^www\./, "").replace(/\/.*$/, "");
  const siteSlug = (s) => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
  async function viewSites(main) {
    main.append(head("All sites", "Every comic running on ComicTable. Start a new one here, then build their front end and launch it."));
    const wrap = h("div", { class: "stack" }); main.append(wrap);

    // ---- new site form ----
    const name = h("input", { id: "nsName", placeholder: "Comic or show name", autocomplete: "off" });
    const id = h("input", { id: "nsId", placeholder: "short-name", autocapitalize: "none", spellcheck: "false" });
    const dom = h("input", { id: "nsDomain", placeholder: "theirname.com (optional, add later)", autocapitalize: "none", spellcheck: "false" });
    const kinds = [["shows", "Stand-up shows", true], ["podcast", "Podcast", true], ["videos", "YouTube", true], ["merch", "Merch", false], ["forum", "Forum", false], ["chat", "Chat room", false]];
    const boxes = Object.fromEntries(kinds.map(([k, , on]) => [k, h("input", { type: "checkbox", checked: on, id: "nsF_" + k })]));
    let idTouched = false;
    name.addEventListener("input", () => { if (!idTouched) id.value = siteSlug(name.value); });
    id.addEventListener("input", () => { idTouched = true; });
    const msg = h("div", { class: "err" });
    const btn = h("button", { class: "btn primary", type: "submit", text: "Create site" });
    const form = h("form", { class: "card stack", onsubmit: async (e) => {
      e.preventDefault(); msg.textContent = "";
      const nm = name.value.trim(), sl = siteSlug(id.value || nm);
      if (!nm) { name.classList.add("bad"); name.focus(); return; }
      if (sl.length < 2) { msg.textContent = "Give the site a short id, like their-name."; id.focus(); return; }
      btn.disabled = true;
      try {
        const r = await sb.rpc("create_site", { p_id: sl, p_name: nm, p_domain: cleanDomain(dom.value) || null });
        if (r.error) throw r.error;
        const features = Object.fromEntries(kinds.map(([k]) => [k, boxes[k].checked]));
        await q(sb.from("sites").update({ features }).eq("id", sl));
        S.sites = await q(sb.from("sites").select("*").order("name", { ascending: true }));
        toast(nm + " is set up. Add the comics next.");
        await switchSite(sl, "people");
      } catch (er) {
        msg.textContent = /create_site/.test(errText(er)) && /function|schema cache/i.test(errText(er)) ? "The database needs 08_create_sites.sql first. Paste it into the Supabase SQL Editor and run it." : errText(er);
        btn.disabled = false;
      }
    } },
      h("h2", { text: "Start a new site" }),
      h("p", { class: "sub", text: "Makes the comic's space on ComicTable: their shows, podcast, videos and fans, kept separate from everyone else's. Then add the comic in that site's Settings → Team. As a super admin you can manage every site without being on its team." }),
      h("div", { class: "grid" }, field("Comic or show name", name, "c6"), field("Site id (used in the launch settings)", id, "c6"), field("Their web address", dom, "c12")),
      h("div", null, h("b", { text: "What's on their site" }), h("div", { class: "btns", style: "margin-top:8px" }, kinds.map(([k, l]) => h("label", { class: "pill", style: "cursor:pointer;gap:6px;display:inline-flex;align-items:center" }, boxes[k], l)))),
      h("div", { class: "hint", text: "You can change any of this later in that site's Settings." }), msg, h("div", { class: "btns" }, btn));

    // ---- list of sites with a launch checklist ----
    const listCard = h("section", { class: "card" }, h("h2", { text: "Sites" }), h("p", { class: "hint", text: "Loading…" }));
    // ---- "Get your site" requests from comictable.com ----
    const reqCard = h("section", { class: "card" });
    async function drawRequests() {
      let reqs;
      try { reqs = await q(sb.from("site_requests").select("*").eq("handled", false).order("created_at", { ascending: false })); }
      catch (e) { reqCard.replaceChildren(); return; }
      reqCard.replaceChildren(h("h2", { text: "Requests from comictable.com" + (reqs.length ? " (" + reqs.length + ")" : "") }),
        reqs.length ? h("div", null, reqs.map((r) => h("div", { class: "switch-row", style: "flex-wrap:wrap;align-items:flex-start" },
          h("div", { style: "flex:1 1 320px" }, h("b", { text: r.name }), h("span", { class: "hint", style: "margin-left:8px", text: ago(r.created_at) }),
            h("div", null, h("a", { href: "mailto:" + r.email, text: r.email })),
            r.act ? h("div", { class: "hint", text: r.act }) : null, r.links ? h("div", { class: "hint", text: r.links }) : null, r.note ? h("div", { style: "margin-top:4px;white-space:pre-wrap", text: r.note }) : null),
          h("div", { class: "btns" },
            h("button", { class: "btn sm", type: "button", text: "Start their site", onclick: () => { set(name, r.name); form.scrollIntoView({ behavior: "smooth" }); name.focus(); } }),
            h("button", { class: "btn sm ghost", type: "button", text: "Mark handled", onclick: async () => { try { await q(sb.from("site_requests").update({ handled: true }).eq("id", r.id)); drawRequests(); } catch (e) { toast(errText(e), { bad: true }); } } })))))
          : empty("No new requests", "When a comic fills in the form on comictable.com, it shows up here."));
    }
    const set = (el, v) => { el.value = v; el.dispatchEvent(new Event("input")); };
    drawRequests();
    const supCard = h("section", { class: "card" });
    (async () => {
      let list;
      try { list = await q(sb.rpc("platform_admin_list")); } catch (e) { return; }
      supCard.replaceChildren(h("h2", { text: "Super admins" }), h("p", { class: "sub", text: "People who can see and manage every site on ComicTable. Keep this to just you, and anyone you'd trust with every comic's account." }),
        h("div", null, list.map((u) => h("div", { class: "switch-row" }, h("div", null, h("b", { text: u.email }), u.you ? h("span", { class: "pill", style: "margin-left:6px", text: "You" }) : null),
          u.you ? null : sure("Remove", async () => { try { await q(sb.rpc("remove_platform_admin", { p_user: u.user_id })); toast(u.email + " is no longer a super admin."); route(); } catch (e) { toast(errText(e), { bad: true }); } })))));
    })();
    wrap.append(reqCard, listCard, form, supCard);
    try {
      const sites = await q(sb.from("sites").select("*").order("created_at", { ascending: true }));
      const counts = async (t, sidv, extra) => { let qq = sb.from(t).select("id", { count: "exact", head: true }).eq("site_id", sidv); if (extra) qq = extra(qq); const r = await qq; return r.error ? 0 : r.count || 0; };
      const rows = await Promise.all(sites.map(async (st) => {
        const [people, shows, srcs] = await Promise.all([counts("hosts", st.id), counts("shows", st.id, (x) => x.gte("date", today())), counts("sources", st.id)]);
        const steps = [["Comics added", people > 0], ["Podcast or YouTube connected", srcs > 0], ["Web address set", !!st.domain]];
        return h("div", { class: "switch-row", style: "flex-wrap:wrap;align-items:flex-start" },
          h("div", { style: "flex:1 1 280px" }, h("b", { text: st.name }), st.id === sid() ? h("span", { class: "pill", style: "margin-left:6px", text: "Open now" }) : null,
            h("div", { class: "hint", text: (st.domain || "No address yet") + " · id: " + st.id + " · " + people + (people === 1 ? " comic" : " comics") + " · " + shows + " upcoming show" + (shows === 1 ? "" : "s") }),
            h("div", { class: "btns", style: "margin-top:6px;gap:6px" }, steps.map(([t, ok]) => h("span", { class: "pill" + (ok ? "" : " warn"), text: (ok ? "✓ " : "○ ") + t })))),
          h("div", { class: "btns" },
            st.id === sid() ? null : h("button", { class: "btn sm", type: "button", text: "Open", onclick: () => switchSite(st.id, "home") }),
            st.domain ? h("a", { class: "btn sm ghost", href: "https://" + st.domain, target: "_blank", rel: "noopener", text: "Visit ↗" }) : null));
      }));
      listCard.replaceChildren(h("h2", { text: "Sites (" + sites.length + ")" }), h("div", null, rows));
    } catch (e) { listCard.replaceChildren(h("h2", { text: "Sites" }), h("p", { class: "err", text: errText(e) })); }
  }

  function clubsReview() {
    const card = h("section", { class: "card" });
    const draw = () => {
      const fresh = S.venues.filter((v) => v.created_by_site && !v.verified).sort((a, b) => String(b.created_at || "").localeCompare(String(a.created_at || "")));
      card.replaceChildren(h("h2", { text: "Recently added clubs" }), h("p", { class: "sub", text: "Clubs comics added. They're already in the shared database; check them over, fix typos, or remove duplicates." }),
        fresh.length ? h("div", null, fresh.map((v) => {
          const nm = h("input", { value: v.name, "aria-label": "Club name" }), ct = h("input", { value: v.city, "aria-label": "City" }), st = h("input", { value: v.state || "", "aria-label": "State", maxlength: "3", style: "width:70px" });
          return h("div", { class: "switch-row", style: "flex-wrap:wrap" }, h("div", { class: "btns", style: "flex:1 1 320px" }, nm, ct, st),
            h("div", { class: "btns" },
              h("button", { class: "btn sm primary", type: "button", text: "Looks good", onclick: async () => { try { await q(sb.from("venues").update({ name: nm.value.trim(), city: ct.value.trim(), state: st.value.trim().toUpperCase() || null, verified: true }).eq("id", v.id)); await reload.venues(); draw(); toast("Checked " + nm.value.trim() + "."); } catch (e) { toast(errText(e), { bad: true }); } } }),
              h("button", { class: "btn sm ghost danger", type: "button", text: "Remove", onclick: async () => { try { await q(sb.from("venues").delete().eq("id", v.id)); await reload.venues(); draw(); toast("Removed. Shows already entered there keep their details."); } catch (e) { toast(errText(e), { bad: true }); } } })));
        })) : empty("Nothing new", S.venues.length + " clubs in the shared database."));
    };
    draw(); return card;
  }

  boot();
})();
</script>
