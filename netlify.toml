# Every comic's site deploys from this one repo. Each Netlify project sets SITE to its site's id
# (sites/<id>/). Cockfight's project doesn't need to: it's the default.
[build]
  command = "node tools/build.mjs"
  # Only rebuild a project when files it uses changed (each published deploy costs Netlify credits)
  ignore = "node tools/should-build.mjs"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
