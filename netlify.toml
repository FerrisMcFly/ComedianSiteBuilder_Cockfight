# Netlify reads this when the site deploys from GitHub.
[build]
  publish = "site"
  command = "echo 'Static site — nothing to build'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
