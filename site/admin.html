<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Comedian Site Builder Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: sticky sidebar + one working column. Each section: a friendly "do the thing" card on top, the live list below. Phones get a top tab row and full-width cards. */
:root {
  --bg: #f6f4f1;
  --panel: #ffffff;
  --line: #e7e3dd;
  --line-strong: #d3cdc4;
  --text: #1b1916;
  --muted: #6c665e;
  --accent: #d6302a;
  --accent-ink: #ffffff;
  --accent-soft: #fdeceb;
  --ok: #1d7a43;
  --ok-soft: #e5f4ea;
  --warn: #8a5d00;
  --warn-soft: #fff3d6;
  --focus: #2b62e3;
  --display: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141311; --panel: #1d1b19; --line: #2e2b27; --line-strong: #3f3b35; --text: #efebe5; --muted: #a39c92;
    --accent: #f0554d; --accent-soft: #3b1f1d; --ok: #57c787; --ok-soft: #17301f; --warn: #e7b547; --warn-soft: #3a3016; --focus: #7aa2ff;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--focus); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3, .brand { font-family: var(--display); letter-spacing: -.015em; }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { font-weight: 800; font-size: 18px; padding: 2px 10px 2px; }
.brand-sub { font-size: 12px; color: var(--muted); padding: 0 10px 14px; }
.nav-btn { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-radius: 10px; padding: 9px 10px; cursor: pointer; color: var(--muted); font-weight: 600; }
.nav-btn .ico { width: 20px; text-align: center; }
.nav-btn .cnt { margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; }
.nav-btn:hover { background: var(--bg); color: var(--text); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.side-foot { margin-top: auto; display: grid; gap: 6px; padding: 12px 10px 4px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
.side-foot .links { display: flex; gap: 12px; flex-wrap: wrap; }

main { padding: 28px max(24px, env(safe-area-inset-right, 0px)) 80px 28px; min-width: 0; max-width: 1120px; width: 100%; }
.page-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
h1 { font-size: 30px; margin: 0; line-height: 1.1; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 64ch; }
.stack { display: grid; gap: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.card > h2 { font-size: 18px; margin: 0 0 4px; }
.card > .sub { margin: 0 0 14px; font-size: 14px; }
.step { display: grid; gap: 8px; padding: 14px 0; border-top: 1px dashed var(--line); }
.step:first-of-type { border-top: 0; padding-top: 4px; }
.step-label { font-weight: 700; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.step-num { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; }

.grid { display: grid; gap: 10px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.c2 { grid-column: span 2; } .c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c9 { grid-column: span 9; } .c12 { grid-column: span 12; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--muted); }
input, select, textarea { width: 100%; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px; padding: 9px 11px; min-width: 0; min-height: 40px; }
textarea { resize: vertical; min-height: 80px; }
input:focus, select:focus, textarea:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent); }
input.bad, select.bad { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
input[type=checkbox] { width: auto; min-height: 0; }

.btn { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 10px; padding: 9px 15px; font-weight: 650; cursor: pointer; white-space: nowrap; min-height: 40px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: inherit; }
.btn:hover { background: var(--bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.big { padding: 12px 22px; font-size: 16px; border-radius: 12px; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--bg); }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; min-height: 32px; }
.btn.danger { color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-strong); border-radius: 12px; padding: 3px; gap: 3px; background: var(--bg); max-width: 100%; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 7px 13px; font-weight: 650; cursor: pointer; color: var(--muted); min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.14); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 13px; }
.chip:hover { border-color: var(--accent); color: var(--accent); }

/* club search */
.combo { position: relative; }
.combo-list { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,.14); padding: 4px; max-height: 320px; overflow-y: auto; }
.combo-item { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 9px 10px; cursor: pointer; }
.combo-item[aria-selected="true"], .combo-item:hover { background: var(--accent-soft); }
.combo-item small { color: var(--muted); }
.combo-item.new { color: var(--accent); font-weight: 700; }
.picked { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--ok-soft); border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent); border-radius: 12px; padding: 10px 12px; }
.picked b { font-size: 16px; }
.newclub { background: var(--bg); border-radius: 12px; padding: 12px; }

/* calendar */
.cal-wrap { display: flex; gap: 18px; flex-wrap: wrap; }
.cal { width: 300px; max-width: 100%; }
.cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-weight: 700; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-dow { font-size: 11px; color: var(--muted); text-align: center; font-weight: 700; padding: 2px 0; }
.day { aspect-ratio: 1; border: 0; background: none; border-radius: 10px; cursor: pointer; font-weight: 600; position: relative; font-variant-numeric: tabular-nums; min-height: 0; }
.day:hover { background: var(--bg); }
.day[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.day:disabled { color: var(--line-strong); cursor: default; background: none; }
.day.today { box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.day .dot { position: absolute; bottom: 4px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--ok); }
.day[aria-pressed="true"] .dot { background: var(--accent-ink); }

/* show grid */
.slots { display: grid; gap: 6px; }
.slot-day { font-weight: 700; font-size: 13px; padding: 8px 0 2px; display: flex; justify-content: space-between; align-items: center; }
.slot { display: grid; grid-template-columns: 128px minmax(0, 1fr) 140px auto; gap: 8px; align-items: center; }
.paste { background: var(--bg); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.note-ok { color: var(--ok); font-weight: 600; font-size: 13px; }
.hint { font-size: 13px; color: var(--muted); }
.err { color: var(--accent); font-weight: 650; font-size: 14px; }
.kbd { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--line-strong); border-radius: 5px; padding: 1px 6px; }

/* tables */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.toolbar .search { max-width: 260px; }
.check { display: inline-flex; gap: 7px; align-items: center; color: var(--muted); font-size: 14px; cursor: pointer; }
.tablewrap { overflow-x: auto; margin: 0 -18px -18px; border-top: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.past td { color: var(--muted); }
tr.editing td { background: var(--warn-soft); vertical-align: top; }
tr.month td { background: var(--bg); font-size: 12px; font-weight: 800; color: var(--muted); padding: 7px 12px; text-transform: uppercase; letter-spacing: .05em; }
td.actions { text-align: right; white-space: nowrap; width: 1%; }
.nowrap { white-space: nowrap; }
.wrap-any { overflow-wrap: anywhere; }
td select.status { min-height: 32px; padding: 4px 8px; width: auto; font-size: 13px; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 9px; background: var(--bg); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.red { background: var(--accent-soft); color: var(--accent); }
.empty { padding: 34px 12px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--text); font-family: var(--display); font-size: 18px; margin-bottom: 4px; }

/* dashboard */
.hello { font-size: 34px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.stat .n { font-family: var(--display); font-size: 32px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .l { color: var(--muted); font-size: 13px; margin-top: 4px; }
.next { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.next .date-badge { width: 64px; height: 64px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; text-align: center; line-height: 1; flex: none; }
.next .date-badge b { font-family: var(--display); font-size: 26px; display: block; }
.next .date-badge small { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
.todo { display: grid; gap: 8px; }
.todo-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; background: var(--warn-soft); border-radius: 10px; }

/* media & people */
.vids { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.vid { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); display: grid; }
.vid img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: var(--bg); }
.vid .body { padding: 10px 12px; display: grid; gap: 6px; }
.vid.hidden img { opacity: .35; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
.person-top { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
.avatar { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; background: var(--bg); border: 1px solid var(--line); flex: none; display: grid; place-items: center; color: var(--muted); font-size: 11px; text-align: center; }
.merch-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.merch-row:first-child { border-top: 0; }
.merch-row img, .merch-row .ph { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: var(--bg); }

.switches { display: grid; gap: 4px; }
.switch-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.switch-row:first-child { border-top: 0; }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; width: 100%; height: 100%; z-index: 1; }
.switch span { position: absolute; inset: 0; background: var(--line-strong); border-radius: 999px; transition: background .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked + span { background: var(--ok); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }

.thread { border-bottom: 1px solid var(--line); padding: 12px 0; display: grid; gap: 8px; }
.thread:last-child { border-bottom: 0; }
.thread-head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.post { background: var(--bg); border-radius: 10px; padding: 8px 10px; display: flex; justify-content: space-between; gap: 10px; }
.post p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }

.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.login { width: 100%; max-width: 380px; }

.toast { position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 12px; display: flex; gap: 14px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.25); z-index: 60; max-width: calc(100% - 32px); font-weight: 600; }
.toast.bad { background: var(--accent); color: #fff; }
.toast button { background: none; border: 0; color: inherit; font-weight: 800; text-decoration: underline; cursor: pointer; padding: 0; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 55; }

@media (max-width: 880px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px max(12px, env(safe-area-inset-left, 0px)) 8px; gap: 4px; }
  .brand { width: 100%; padding: 0 4px; } .brand-sub { width: 100%; padding: 0 4px 6px; }
  .nav-btn { width: auto; padding: 8px 10px; } .nav-btn .cnt { display: none; }
  .side-foot { margin: 0; width: 100%; border-top: 0; padding: 6px 4px 0; display: flex; justify-content: space-between; flex-wrap: wrap; }
  main { padding: 18px max(14px, env(safe-area-inset-right, 0px)) 80px max(14px, env(safe-area-inset-left, 0px)); }
  .c2, .c3, .c4, .c5, .c6, .c7, .c8, .c9 { grid-column: span 12; }
  .slot { grid-template-columns: 1fr 1fr auto; }
  .slot .url { grid-column: 1 / -1; grid-row: 2; }
  .slot .rm { grid-column: 3; grid-row: 1; }
  h1 { font-size: 26px; } .hello { font-size: 28px; }
  .cal { width: 100%; }
}
@media (min-width: 881px) { .app { background: linear-gradient(90deg, var(--panel) 236px, transparent 236px); } }
/* phones: table rows become stacked cards */
@media (max-width: 640px) {
  .tablewrap { overflow-x: visible; }
  .tablewrap thead { display: none; }
  .tablewrap tbody tr { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 4px 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); align-items: start; }
  .tablewrap tbody tr.month { display: block; padding: 0; border: 0; }
  .tablewrap tbody tr.month td { display: block; padding: 7px 18px; }
  .tablewrap tbody td { display: block; border: 0; padding: 0; min-width: 0; }
  .tablewrap tbody td:empty { display: none; }
  .tablewrap tbody td.actions { grid-column: 1 / -1; text-align: left; width: auto; margin-left: -10px; }
  .tablewrap tbody tr.editing { grid-template-columns: 1fr; }
  .tablewrap tbody tr.editing td { padding: 2px 0; }
  .wrap-any { overflow-wrap: break-word; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="root"><div class="login-wrap"><p>Loading…</p></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<canvas id="confetti" hidden></canvas>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
  "use strict";
  const CFG = window.COCKFIGHT_CONFIG || {};
  const root = document.getElementById("root");
  const $ = (id) => document.getElementById(id);

  /* ============ DOM helper ============ */
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k === "value") e.value = v;
      else if (k === "checked") e.checked = !!v;
      else if (k === "selected") e.selected = !!v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat(Infinity)) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : String(c));
    return e;
  }
  const field = (label, input, cls) => h("label", { class: "field " + (cls || "") }, h("span", { text: label }), input);
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

  /* ============ feedback ============ */
  let toastTimer;
  function toast(msg, opts = {}) {
    const t = $("toast"); t.textContent = ""; t.className = "toast" + (opts.bad ? " bad" : "");
    t.append(h("span", { text: msg }));
    if (opts.action) t.append(h("button", { type: "button", text: opts.action.label, onclick: () => { t.hidden = true; opts.action.run(); } }));
    t.hidden = false; clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, opts.action ? 7000 : 3200);
  }
  function errText(e) {
    const m = (e && (e.message || e.error_description)) || String(e);
    if (/row-level security|permission denied|42501/i.test(m)) return "Not allowed. Your login isn't an admin of this site, or a database setup step was skipped.";
    if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Couldn't reach the database. Check your connection and try again.";
    if (/duplicate key|23505/i.test(m)) return "That already exists.";
    return m;
  }
  function confetti() {
    if (matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const c = $("confetti"), ctx = c.getContext && c.getContext("2d"); if (!ctx) return;
    c.hidden = false; c.width = innerWidth; c.height = innerHeight;
    const colors = ["#d6302a", "#ffb627", "#2a7d2e", "#00a6a6", "#ff4fd8"];
    const bits = Array.from({ length: 90 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 160, y: innerHeight * .65, vx: (Math.random() - .5) * 11, vy: -Math.random() * 13 - 6, r: Math.random() * 6 + 3, c: colors[Math.floor(Math.random() * colors.length)], a: Math.random() * 6 }));
    let f = 0;
    (function tick() {
      ctx.clearRect(0, 0, c.width, c.height);
      for (const b of bits) { b.x += b.vx; b.y += b.vy; b.vy += .45; b.a += .2; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a); ctx.fillStyle = b.c; ctx.fillRect(-b.r / 2, -b.r / 2, b.r, b.r * .6); ctx.restore(); }
      if (++f < 90) requestAnimationFrame(tick); else { ctx.clearRect(0, 0, c.width, c.height); c.hidden = true; }
    })();

  /* ======================================================

  function clubsReview() {
    const card = h("section", { class: "card" });
