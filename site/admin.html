<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Cockfight Admin</title>
<style>
/* Layout: fixed sidebar nav + one working column; each section is "add" card on top, live table below. Stacks to a top tab row on phones. */
:root {
  --bg: #f4f5f7;
  --panel: #ffffff;
  --line: #e3e5ea;
  --line-strong: #cfd3da;
  --text: #16181d;
  --muted: #646b78;
  --accent: #c2261f;
  --accent-soft: #fdecea;
  --ok: #1f7a3d;
  --ok-soft: #e7f5ec;
  --warn-soft: #fff6db;
  --focus: #2563eb;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111317; --panel: #191c21; --line: #2a2e36; --line-strong: #3a3f49; --text: #eceef2; --muted: #9aa1ad;
    --accent: #f0544c; --accent-soft: #3a1d1c; --ok: #4cc27a; --ok-soft: #173123; --warn-soft: #3a3217; --focus: #6b9bff;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
a { color: var(--focus); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.brand { font-weight: 800; font-size: 16px; padding: 4px 10px 14px; display: flex; align-items: center; gap: 8px; }
.nav-btn { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 9px 10px; cursor: pointer; color: var(--muted); font-weight: 600; }
.nav-btn:hover { background: var(--bg); color: var(--text); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav-count { font-size: 12px; font-variant-numeric: tabular-nums; opacity: .8; }
.side-foot { margin-top: auto; display: grid; gap: 6px; padding: 10px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
.side-foot .row-btns { display: flex; gap: 8px; flex-wrap: wrap; }

main { padding: 24px max(20px, env(safe-area-inset-right, 0px)) 60px 24px; min-width: 0; max-width: 1180px; }
.page-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 2px 0 0; }
.stack { display: grid; gap: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.card h2 { font-size: 15px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.kbd { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 1px 5px; }

.grid { display: grid; gap: 10px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.c2 { grid-column: span 2; } .c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 600; color: var(--muted); }
input, select, textarea { width: 100%; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; min-width: 0; }
textarea { resize: vertical; min-height: 72px; }
input:focus, select:focus, textarea:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 20%, transparent); }
input.bad { border-color: var(--accent); }

.btn { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--bg); }
.btn.sm { padding: 4px 9px; font-size: 12px; border-radius: 6px; }
.btn.danger { color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-strong); border-radius: 9px; padding: 2px; gap: 2px; background: var(--bg); }
.seg button { border: 0; background: none; border-radius: 7px; padding: 6px 12px; font-weight: 600; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.dates { display: grid; gap: 8px; }
.date-row { display: grid; grid-template-columns: 170px 130px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.date-row .n { display: none; }
.hint { font-size: 12px; color: var(--muted); }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.toolbar .search { max-width: 280px; }
.check { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer; }
.check input { width: auto; }
.tablewrap { overflow-x: auto; margin: 0 -16px -16px; border-top: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--panel); position: sticky; top: 0; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: color-mix(in srgb, var(--bg) 60%, transparent); }
tr.past td { color: var(--muted); }
tr.editing td { background: var(--warn-soft) !important; vertical-align: top; }
td.actions { text-align: right; white-space: nowrap; width: 1%; }
td.nowrap { white-space: nowrap; }
.wrap-any { overflow-wrap: anywhere; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; background: var(--bg); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: #8a6400; }
.pill.red { background: var(--accent-soft); color: var(--accent); }
.empty { padding: 28px 12px; text-align: center; color: var(--muted); }
.month td { background: var(--bg) !important; font-size: 12px; font-weight: 700; color: var(--muted); padding: 6px 12px; text-transform: uppercase; letter-spacing: .04em; }

.hosts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
.host-top { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
.host-top img { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; background: var(--bg); border: 1px solid var(--line); flex: none; }
.host-top .ph { width: 76px; height: 76px; border-radius: 50%; background: var(--bg); border: 1px dashed var(--line-strong); display: grid; place-items: center; color: var(--muted); font-size: 11px; flex: none; text-align: center; }

.thread { border-bottom: 1px solid var(--line); padding: 12px 0; display: grid; gap: 8px; }
.thread:last-child { border-bottom: 0; }
.thread-head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.post { background: var(--bg); border-radius: 8px; padding: 8px 10px; display: flex; justify-content: space-between; gap: 10px; }
.post p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }

.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.login { width: 100%; max-width: 360px; }
.err { color: var(--accent); font-weight: 600; font-size: 13px; }

.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px; display: flex; gap: 12px; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.2); z-index: 50; max-width: calc(100% - 32px); }
.toast.bad { background: var(--accent); color: #fff; }
.toast button { background: none; border: 0; color: inherit; font-weight: 800; text-decoration: underline; cursor: pointer; padding: 0; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px max(12px, env(safe-area-inset-left, 0px)); gap: 4px; }
  .brand { width: 100%; padding: 2px 4px 6px; }
  .nav-btn { width: auto; padding: 7px 10px; }
  .nav-count { display: none; }
  .side-foot { margin: 0; width: 100%; border-top: 0; padding: 6px 4px 0; display: flex; justify-content: space-between; }
  main { padding: 16px max(14px, env(safe-area-inset-right, 0px)) 60px max(14px, env(safe-area-inset-left, 0px)); }
  .c2, .c3, .c4, .c5, .c6, .c8 { grid-column: span 12; }
  .date-row { grid-template-columns: 1fr 1fr auto; }
  .date-row .url { grid-column: 1 / -1; grid-row: 2; }
  .date-row .rm { grid-column: 3; grid-row: 1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>

<script>
(() => {
  "use strict";
  const CFG = window.COCKFIGHT_CONFIG || {};
  const root = document.getElementById("root");
  const $ = (id) => document.getElementById(id);

  /* ---------- tiny DOM helper ---------- */
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k === "value") e.value = v;
      else if (k === "checked") e.checked = !!v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat(Infinity)) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : String(c));
    return e;
  }
  const field = (label, input, cls) => h("label", { class: "field " + (cls || "") }, h("span", { text: label }), input);

  /* ---------- toast with optional Undo ---------- */
  let toastTimer;
  function toast(msg, opts = {}) {
    const t = $("toast"); t.textContent = ""; t.className = "toast" + (opts.bad ? " bad" : "");
    t.append(h("span", { text: msg }));
    if (opts.action) t.append(h("button", { type: "button", text: opts.action.label, onclick: () => { t.hidden = true; opts.action.run(); } }));
    t.hidden = false; clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, opts.action ? 7000 : 3000);
  }
  function errText(e) {
    const m = (e && (e.message || e.error_description)) || String(e);
    if (/row-level security|permission denied|42501/i.test(m)) return "Not allowed. This login isn't on the admin list, or the database permissions step was skipped.";
    if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Couldn't reach the database. Check your connection.";
    return m;
  }

  /* ---------- dates & times ---------- */
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const today = () => iso(new Date());
  const parseISO = (s) => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { if (!s) return ""; const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
  const niceDate = (s) => { if (!s) return ""; const d = parseISO(s); return DOW[d.getDay()] + " " + MON[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); };
  const monthLabel = (s) => { const d = parseISO(s); return MON[d.getMonth()] + " " + d.getFullYear(); };
  function to12(t) { // "19:30" -> "7:30 PM"
    if (!t) return null; const [H, M] = t.split(":").map(Number); if (isNaN(H)) return t;
    return ((H % 12) || 12) + ":" + pad(M || 0) + " " + (H >= 12 ? "PM" : "AM");
  }
  function to24(t) { // "7:30 PM" -> "19:30"
    if (!t) return ""; const m = String(t).match(/(\d{1,2})(?::(\d{2}))?\s*([ap])?/i); if (!m) return "";
    let H = +m[1]; const M = +(m[2] || 0), ap = (m[3] || "").toLowerCase();
    if (ap === "p" && H < 12) H += 12; if (ap === "a" && H === 12) H = 0;
    return pad(H) + ":" + pad(M);
  }
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

  /* ---------- connection ---------- */
  if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY || !window.supabase) {
    root.replaceChildren(h("div", { class: "login-wrap" }, h("div", { class: "card login" }, h("h1", { text: "Not connected" }), h("p", { class: "sub", text: "The database connection details are missing from this page." }))));
    return;
  }
  const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  const S = { hosts: [], shows: [], episodes: [], user: "" };
  const hostName = (id) => (S.hosts.find((x) => x.id === id) || {}).name || id;
  const first = (id) => hostName(id).split(" ")[0];
  async function q(promise) { const r = await promise; if (r.error) throw r.error; return r.data; }
  async function loadAll() {
    const [hosts, shows, episodes] = await Promise.all([
      q(sb.from("hosts").select("*").order("sort", { ascending: true })),
      q(sb.from("shows").select("*").order("date", { ascending: true })),
      q(sb.from("episodes").select("*").order("num", { ascending: false }))
    ]);
    Object.assign(S, { hosts, shows, episodes });
  }
  const reloadShows = async () => { S.shows = await q(sb.from("shows").select("*").order("date", { ascending: true })); };
  const reloadEps = async () => { S.episodes = await q(sb.from("episodes").select("*").order("num", { ascending: false })); };

  /* ---------- login ---------- */
  function showLogin(msg) {
    const user = h("input", { id: "lgUser", autocomplete: "username", autocapitalize: "none", spellcheck: "false", required: true });
    const pass = h("input", { id: "lgPass", type: "password", autocomplete: "current-password", required: true });
    const btn = h("button", { class: "btn primary", type: "submit", text: "Log in" });
    const form = h("form", { class: "card login stack", onsubmit: async (e) => {
      e.preventDefault(); btn.disabled = true;
      let who = user.value.trim(); if (!who.includes("@")) who = who.toLowerCase() + "@cockfightpodcast.com";
      const r = await sb.auth.signInWithPassword({ email: who, password: pass.value });
      btn.disabled = false;
      if (r.error) return showLogin("Wrong username or password.");
      boot();
    } },
      h("div", null, h("h1", { text: "🐓 Cockfight Admin" }), h("p", { class: "sub", text: "Log in to edit the site." })),
      field("Username or email", user), field("Password", pass),
      msg ? h("div", { class: "err", text: msg }) : null, btn);
    root.replaceChildren(h("div", { class: "login-wrap" }, form));
    user.focus();
  }

  async function boot() {
    const { data } = await sb.auth.getSession();
    const session = data && data.session;
    if (!session) return showLogin();
    const a = await sb.rpc("is_admin");
    if (a.error || !a.data) { await sb.auth.signOut(); return showLogin("This login isn't an admin yet."); }
    S.user = session.user.email.replace(/@cockfightpodcast\.com$/, "");
    try { await loadAll(); } catch (e) { root.replaceChildren(h("div", { class: "login-wrap" }, h("div", { class: "card login" }, h("h1", { text: "Couldn't load" }), h("p", { class: "err", text: errText(e) })))); return; }
    route();
  }

  /* ---------- shell ---------- */
  const SECTIONS = [
    { id: "dates", label: "Tour dates", count: () => S.shows.filter((s) => s.date >= today()).length, render: viewDates },
    { id: "episodes", label: "Episodes", count: () => S.episodes.length, render: viewEpisodes },
    { id: "hosts", label: "Hosts", render: viewHosts },
    { id: "announce", label: "Announcements", render: viewAnnounce },
    { id: "forum", label: "Forum", render: viewForum }
  ];
  function current() { const id = location.hash.slice(1); return SECTIONS.find((s) => s.id === id) || SECTIONS[0]; }
  window.addEventListener("hashchange", () => { if (S.user) route(); });
  function route() {
    const cur = current();
    const nav = SECTIONS.map((s) => h("button", { class: "nav-btn", type: "button", "aria-current": s === cur ? "page" : null, onclick: () => { location.hash = s.id; } },
      h("span", { text: s.label }), s.count ? h("span", { class: "nav-count", text: s.count() }) : null));
    const main = h("main", { id: "main" });
    root.replaceChildren(h("div", { class: "app" },
      h("aside", { class: "side" }, h("div", { class: "brand", text: "🐓 Cockfight Admin" }), nav,
        h("div", { class: "side-foot" }, h("span", { text: "Logged in as " + S.user }),
          h("div", { class: "row-btns" }, h("a", { href: "./", target: "_blank", rel: "noopener", text: "View site ↗" }),
            h("a", { href: "#", onclick: async (e) => { e.preventDefault(); await sb.auth.signOut(); S.user = ""; showLogin(); }, text: "Log out" })))),
      main));
    cur.render(main);
  }
  const refreshNav = () => document.querySelectorAll(".nav-btn").forEach((b, i) => { const c = b.querySelector(".nav-count"); if (c && SECTIONS[i].count) c.textContent = SECTIONS[i].count(); });
  const head = (title, sub, right) => h("div", { class: "page-head" }, h("div", null, h("h1", { text: title }), sub ? h("p", { class: "sub", text: sub }) : null), right || null);

  /* ======================================================
     TOUR DATES
     ====================================================== */
  const draft = { host: store.get("cf_host") || "", venue: "", city: "", url: "", rows: [{ date: "", time: "", url: "" }] };
  const filt = { host: "all", past: false };
  let editingShow = null;

  function viewDates(main) {
    if (!S.hosts.find((x) => x.id === draft.host)) draft.host = (S.hosts[0] || {}).id || "";
    const addCard = h("section", { class: "card" });
    const listCard = h("section", { class: "card" });
    main.append(head("Tour dates", "Shows drop off the public site the day after they happen."), h("div", { class: "stack" }, addCard, listCard));
    drawAdd(addCard, listCard); drawList(listCard, addCard);
  }

  function knownVenues() {
    const m = new Map();
    for (const s of S.shows) if (s.venue) m.set(s.venue, s);
    return [...m.values()];
  }

  function drawAdd(card, listCard) {
    const venues = knownVenues();
    const cities = [...new Set(S.shows.map((s) => s.city).filter(Boolean))];
    const seg = h("div", { class: "seg", role: "group", "aria-label": "Comedian" },
      S.hosts.map((x) => h("button", { type: "button", "aria-pressed": String(draft.host === x.id), text: x.name, onclick: () => { draft.host = x.id; store.set("cf_host", x.id); drawAdd(card, listCard); } })));
    const venue = h("input", { id: "addVenue", list: "venueList", value: draft.venue, placeholder: "The Comedy Club at Duckworth's", autocomplete: "off" });
    const city = h("input", { id: "addCity", list: "cityList", value: draft.city, placeholder: "Charlotte, NC", autocomplete: "off" });
    const url = h("input", { id: "addUrl", type: "url", value: draft.url, placeholder: "https://… (used for every date unless you add one per date)" });
    venue.addEventListener("input", () => {
      draft.venue = venue.value;
      const hit = venues.find((v) => v.venue.toLowerCase() === venue.value.trim().toLowerCase());
      if (hit && !city.value) { city.value = draft.city = hit.city || ""; }
    });
    city.addEventListener("input", () => { draft.city = city.value; });
    url.addEventListener("input", () => { draft.url = url.value; });

    const rowsBox = h("div", { class: "dates" });
    function drawRows(focusLast) {
      rowsBox.replaceChildren(...draft.rows.map((r, i) => {

    card.replaceChildren(h("form", { class: "stack", onsubmit: async (e) => {
      e.preventDefault(); save.disabled = true;
      try { await q(sb.from("settings").upsert([{ key: "marquee", value: marquee.value.trim() }, { key: "headline", value: headline.value.trim() }])); toast("Saved. Live now."); }
      catch (err) { toast(errText(err), { bad: true }); }
      save.disabled = false;
    } }, field("Scrolling text", marquee), field("Home page headline", headline), h("div", { class: "btns" }, save)));
  }

  /* ======================================================
     FORUM
     ====================================================== */
  async function viewForum(main) {
    main.append(head("Forum", "Newest activity first. Deleting a topic deletes its replies."));
    const card = h("section", { class: "card" }, h("p", { class: "hint", text: "Loading…" })); main.append(card);
    const BOARD = { general: "General", episodes: "Episode Talk", tour: "Live Shows", cantina: "Off Topic" };
    const when = (ms) => { const d = new Date(Number(ms)); return isNaN(d) ? "" : MON[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); };
    const sure = (label, run) => { const b = h("button", { class: "btn ghost sm danger", type: "button", text: label, onclick: () => { if (b.dataset.sure) return run(b); b.dataset.sure = "1"; b.textContent = "Really delete?"; setTimeout(() => { delete b.dataset.sure; b.textContent = label; }, 3000); } }); return b; };
    async function load() {
      let threads; try { threads = await q(sb.from("threads").select("*").order("last_at", { ascending: false }).limit(200)); } catch (err) { card.replaceChildren(h("p", { class: "err", text: errText(err) })); return; }
      if (!threads.length) { card.replaceChildren(h("div", { class: "empty", text: "No forum posts yet." })); return; }
      card.replaceChildren(...threads.map((t) => {
        const posts = h("div", { class: "stack", hidden: true, style: "gap:6px" });
        const toggle = h("button", { class: "btn ghost sm", type: "button", text: "Posts (" + (t.replies + 1) + ")", onclick: async () => {
          if (!posts.hidden) { posts.hidden = true; return; }
          posts.hidden = false; posts.replaceChildren(h("span", { class: "hint", text: "Loading…" }));
          try {
            const ps = await q(sb.from("posts").select("*").eq("thread_id", t.id).order("created_at", { ascending: true }));
            posts.replaceChildren(...ps.map((p) => h("div", { class: "post" }, h("div", null, h("b", { text: p.author }), h("span", { class: "hint", text: " · " + when(p.created_at) }), h("p", { text: p.body })),
              sure("Delete", async () => { try { await q(sb.from("posts").delete().eq("id", p.id)); toast("Post deleted."); load(); } catch (err) { toast(errText(err), { bad: true }); } }))));
          } catch (err) { posts.replaceChildren(h("p", { class: "err", text: errText(err) })); }
        } });
        return h("div", { class: "thread" },
          h("div", { class: "thread-head" },
            h("div", { style: "min-width:0" }, h("b", { class: "wrap-any", text: t.title }), h("div", { class: "hint", text: (BOARD[t.board] || t.board) + " · by " + t.author + " · last post " + when(t.last_at) })),
            h("div", { class: "btns" }, toggle, sure("Delete topic", async () => { try { await q(sb.from("threads").delete().eq("id", t.id)); toast("Topic deleted."); load(); } catch (err) { toast(errText(err), { bad: true }); } }))),
          posts);
      }));
    }
    load();
  }

  boot();
})();
</script>
</body>
</html>
