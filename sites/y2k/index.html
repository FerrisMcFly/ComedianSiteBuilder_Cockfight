<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comedian</title>
<meta name="description" content="Shows, videos and more.">
<meta property="og:title" content="Comedian" data-ct="title">
<meta property="og:description" content="Shows, videos and more." data-ct="description">
<meta property="og:image" content="" data-ct="image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* Y2K Chrome: a ComicTable template. Glossy early-2000s chrome and bubbles. Every word that isn't the comic's own data
   is a Design setting (theme.json), so nothing jokey is baked in. */
:root { --ink: #1E1A4D; --soft: #5A5590; --violet: #3B2A8F; --purple: #7B5CFF; --mint: #2EC79A; --accent: #FF5FC8;
  --chrome: "Audiowide", "Arial Black", sans-serif; --font: "Nunito", system-ui, sans-serif; }
* { box-sizing: border-box; }
html { min-height: 100%; background: linear-gradient(180deg, #DCE6FF 0%, #F3D9FF 45%, #D9FFF6 100%); }
body { margin: 0; min-height: 100vh; color: var(--ink); font: 600 17px/1.45 var(--font); }
a { color: var(--violet); }
img { display: block; max-width: 100%; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
.page { max-width: 620px; margin: 0 auto; padding: 16px 14px 0; }
.bar { padding: 8px 14px; border-radius: 999px; background: linear-gradient(180deg, #fff, #C9CFE6); box-shadow: inset 0 -2px 0 rgba(0,0,0,.12), 0 2px 6px rgba(60,40,140,.2); display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 800; font-size: 13px; }
.bar .on { display: flex; align-items: center; gap: 6px; } .bar .on::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #34E07A; box-shadow: 0 0 6px #34E07A; }
.hero { position: relative; padding: 28px 4px 0; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.spark { position: absolute; width: 34px; height: 34px; } .spark.a { left: 8%; top: 40px; } .spark.b { right: 10%; top: 150px; width: 22px; height: 22px; }
.chromeframe { padding: 6px; border-radius: 34px; background: linear-gradient(135deg, #fff, #A9B2D6 40%, #fff 60%, #8C95BF); box-shadow: 0 12px 28px rgba(60,40,140,.3); }
.chromeframe img { width: min(62vw, 240px); aspect-ratio: 1; object-fit: cover; border-radius: 28px; }
.hero .ct-coaster { width: min(80%, 320px); }
.hero h1 { margin: 0; font: 400 clamp(40px, 12vw, 68px)/1.05 var(--chrome); background: linear-gradient(180deg, #fff 0%, #9AA3C7 45%, #3E4670 52%, #C9D0EE 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 1px var(--violet); letter-spacing: 1px; text-transform: uppercase; overflow-wrap: anywhere; }
.hero p { margin: 0; max-width: 440px; font-weight: 700; }
.glass { margin-top: 26px; padding: 14px; border-radius: 26px; background: rgba(255,255,255,.6); border: 2px solid #fff; box-shadow: 0 8px 24px rgba(60,40,140,.15); display: flex; flex-direction: column; gap: 10px; }
.glass h2 { margin: 0 4px; font: 400 20px var(--chrome); color: var(--violet); }
.show { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 18px; background: #fff; }
.show .tile { width: 56px; height: 56px; flex: none; border-radius: 16px; background: linear-gradient(180deg, var(--accent), var(--purple)); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; font-weight: 900; }
.show .tile span { font-size: 11px; } .show .tile b { font-size: 22px; }
.show .w { flex: 1; min-width: 0; display: flex; flex-direction: column; } .show .w span { font-size: 14px; color: var(--soft); }
.show.sold { opacity: .65; } .show.sold .tile { background: #C9CFE6; color: var(--ink); }
.tix { padding: 0 16px; min-height: 44px; display: flex; align-items: center; border-radius: 999px; background: linear-gradient(180deg, #8EF5D0, var(--mint)); color: #0E3B2E; text-decoration: none; font-weight: 900; box-shadow: inset 0 2px 0 rgba(255,255,255,.7); }
.tix.soon { background: #E9ECF8; color: var(--ink); }
.gone { font-weight: 900; font-size: 14px; }
.empty { margin: 0 4px; }
.player { margin-top: 22px; padding: 12px; border-radius: 26px; background: linear-gradient(180deg, #E9ECF8, #B9C0DE); border: 2px solid #fff; box-shadow: 0 8px 24px rgba(60,40,140,.15); }
.player a.screen { display: block; position: relative; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: linear-gradient(135deg, #2B1D7A, #0B0A2A); }
.player img { width: 100%; height: 100%; object-fit: cover; opacity: .85; }
.player i { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; margin: -31px 0 0 -31px; border-radius: 50%; background: linear-gradient(180deg, #fff, #C9CFE6); display: grid; place-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
.player i::before { content: ""; border-left: 16px solid var(--violet); border-top: 10px solid transparent; border-bottom: 10px solid transparent; margin-left: 4px; }
.player .cap { padding: 10px 6px 2px; font-weight: 800; }
.pod { margin-top: 22px; display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 22px; background: rgba(255,255,255,.6); border: 2px solid #fff; }
.pod .art { width: 64px; height: 64px; flex: none; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #B9C0DE 40%, #6C7499); display: grid; place-items: center; font: 400 16px var(--chrome); color: var(--ink); object-fit: cover; }
.pod b { font-size: 18px; display: block; } .pod .sub { font-size: 14px; color: var(--soft); display: block; }
.pod .links { display: flex; gap: 12px; flex-wrap: wrap; font-size: 14px; font-weight: 800; }
.socials { margin-top: 22px; display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
.socials a { text-align: center; padding: 12px 0; min-height: 44px; border-radius: 999px; background: linear-gradient(180deg, #fff, #C9CFE6); text-decoration: none; font-weight: 900; text-transform: lowercase; box-shadow: inset 0 -2px 0 rgba(0,0,0,.1); color: var(--ink); }
.join { margin: 24px 0; padding: 18px; border-radius: 26px; background: linear-gradient(180deg, var(--accent), var(--purple)); color: #fff; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 26px rgba(123,92,255,.35); }
.join h2 { margin: 0; font: 400 24px var(--chrome); }
.join p { margin: 0; font-weight: 700; }
.ctt-join { display: grid; gap: 10px; }
.ctt-join label { display: grid; gap: 4px; font-weight: 800; }
.ctt-join input { height: 46px; border: 0; border-radius: 999px; padding: 0 16px; font: 700 16px var(--font); }
.ctt-join button { min-height: 50px; border: 0; border-radius: 999px; background: linear-gradient(180deg, #fff, #D6DBF0); color: var(--violet); font: 900 17px var(--font); cursor: pointer; }
.ctt-msg { font-weight: 900; min-height: 1.2em; }
.ctt-fine { font-size: 13px; } .ctt-fine a { color: #fff; }
footer { padding: 14px; text-align: center; font-weight: 800; font-size: 13px; color: var(--soft); }
.ctt-down { padding: 60px 20px; text-align: center; }
@media (min-width: 900px) { .page { max-width: 1000px; } .join { max-width: 620px; margin: 28px auto; } .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; } }
</style>
</head>
<body>
<main id="app"><p class="ctt-down">Loading…</p></main>
<script src="config.js"></script>
<script src="sdk/csb.js"></script>
<script src="sdk/templates.js"></script>
<script>
CTT.start(function (k, app) {
  "use strict";
  var el = k.el;
  // keep these in step with theme.json (a test checks)
  var W = { status: "{name} is online", now_playing: "♪ now playing", shows_title: "upcoming shows", podcast_line: "the podcast",
    join_title: "add me to ur list ✦", join_line: "Hear first when {name} plays near you.", join_button: "sign me up", footer: "best viewed on any screen" };
  var say = function (key) { return k.t(key, W[key]); };
  var video = k.video(), pod = k.podcast(), shows = k.shows(), socials = k.socials(), join = k.join({ button: say("join_button") || W.join_button });
  var page = el("div", { class: "page" });
  var spark = function (cls) { var s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("class", "spark " + cls); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true");
    s.innerHTML = '<path d="M12 0l2.5 9.5L24 12l-9.5 2.5L12 24l-2.5-9.5L0 12l9.5-2.5z" fill="' + (cls === "a" ? "#FFFFFF" : "var(--accent)") + '"/>'; return s; };

  if (say("status") || say("now_playing")) page.append(el("div", { class: "bar" }, [say("status") ? el("span", { class: "on", text: say("status") }) : el("span"), el("span", { text: say("now_playing") })]));
  page.append(el("header", { class: "hero" }, [spark("a"), spark("b"),
    k.coaster ? k.coasterPhoto() : k.photo ? el("div", { class: "chromeframe" }, el("img", { src: k.photo, alt: k.name })) : null,
    el("h1", { text: k.name }), k.bio ? el("p", { text: k.bio }) : null]));

  var left = el("div"), right = el("div");
  if (k.has("shows")) left.append(el("section", { class: "glass", "aria-label": say("shows_title") || "Shows" }, [say("shows_title") ? el("h2", { text: say("shows_title") }) : null].concat(
    shows.length ? shows.map(function (s) {
      return el("div", { class: "show" + (s.sold ? " sold" : "") }, [el("span", { class: "tile" }, [el("span", { text: s.mon.toUpperCase() }), el("b", { text: String(s.day) })]),
        el("span", { class: "w" }, [el("b", { text: s.venue }), el("span", { text: [s.city, s.few ? "a few left!" : ""].filter(Boolean).join(" · ") })]),
        s.sold ? el("span", { class: "gone", text: "sold out" }) : k.ticket(s, "tix", "tix")]);
    }) : [el("p", { class: "empty", text: "No dates right now." })])));
  if (video) right.append(el("div", { class: "player" }, [el("a", { class: "screen", href: video.link, target: "_blank", rel: "noopener", "aria-label": "Watch " + video.title }, [el("img", { src: video.thumbnail, alt: "", loading: "lazy" }), el("i", { "aria-hidden": "true" })]),
    el("div", { class: "cap", text: video.title })]));
  if (pod) right.append(el("div", { class: "pod" }, [pod.art ? el("img", { class: "art", src: pod.art, alt: "" }) : el("span", { class: "art", "aria-hidden": "true", text: (pod.name.indexOf(" ") > 0 ? pod.name.split(/\s+/).map(function (w) { return w[0]; }).join("") : pod.name).slice(0, 2).toUpperCase() }),
    el("div", null, [el("b", { text: pod.name }), say("podcast_line") ? el("span", { class: "sub", text: say("podcast_line") }) : null, el("div", { class: "links" }, pod.links.map(function (l) { return el("a", { href: l.url, target: "_blank", rel: "noopener", text: l.label }); }))])]));
  if (socials.length) right.append(el("div", { class: "socials" }, socials.map(function (x) { return el("a", { href: x.url, target: "_blank", rel: "noopener", text: x.label }); })));
  page.append(el("div", { class: "cols" }, [left, right]));
  if (join) page.append(el("section", { class: "join", "aria-label": "Mailing list" }, [say("join_title") ? el("h2", { text: say("join_title") }) : null, say("join_line") ? el("p", { text: say("join_line") }) : null, join]));
  page.append(el("footer", { text: ["Runs on ComicTable", say("footer")].filter(Boolean).join(" ✦ ") }));
  app.append(page);
});
</script>
</body>
</html>
