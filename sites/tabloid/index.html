<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comedian</title>
<meta name="description" content="Shows, videos and more.">
<meta property="og:title" content="Comedian" data-ct="title">
<meta property="og:description" content="Shows, videos and more." data-ct="description">
<meta property="og:image" content="" data-ct="image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Libre+Franklin:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Tabloid: a ComicTable template. A newspaper front page about the comic. Every line that isn't the comic's own
   data (masthead, banner, headline, captions, headings) is a Design setting in theme.json. */
:root { --paper: #F2EDE1; --ink: #141414; --muted: #6A655A; --accent: #C8102E;
  --serif: "Playfair Display", Georgia, serif; --block: "Anton", Impact, sans-serif; --sans: "Libre Franklin", Arial, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; background: #D9D3C4; color: var(--ink); font: 400 16px/1.5 var(--sans); }
a { color: inherit; }
img { display: block; max-width: 100%; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.paper { max-width: 1000px; margin: 0 auto; background: var(--paper); min-height: 100vh; }
@media (min-width: 900px) { .paper { margin: 32px auto; min-height: 0; box-shadow: 0 20px 50px rgba(0,0,0,.25); } }
.mast { padding: 14px 16px 10px; border-bottom: 3px double var(--ink); text-align: center; }
.edition { display: flex; justify-content: space-between; gap: 8px; font: 600 11px var(--sans); letter-spacing: 1px; text-transform: uppercase; }
.mast h1 { margin: 6px 0 0; font: 900 clamp(34px, 9vw, 72px)/1 var(--serif); letter-spacing: -1px; }
.banner { background: var(--accent); color: #fff; padding: 6px 16px; display: flex; justify-content: space-between; gap: 8px; font: 800 13px var(--sans); letter-spacing: 2px; text-transform: uppercase; }
.body { padding: 0 16px 10px; }
.lead { padding-top: 14px; }
.lead h2 { margin: 0; font: 400 clamp(52px, 13vw, 104px)/0.9 var(--block); text-transform: uppercase; }
.lead p { margin: 8px 0 0; font: italic 700 clamp(18px, 3vw, 24px)/1.3 var(--serif); }
.story { padding-top: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
@media (min-width: 900px) { .story { grid-template-columns: 320px minmax(0, 1fr); gap: 24px; } .story .copy { font-size: 19px; } }
.story figure { margin: 0; }
.story figure > img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; filter: grayscale(1) contrast(1.2); }
.story figcaption { font: italic 400 12px var(--sans); margin-top: 4px; }
.story .copy { margin: 0; font-size: 15px; line-height: 1.5; }
.story .copy b.cap { float: left; font: 900 54px/0.8 var(--serif); margin: 4px 6px 0 0; }
.grid { display: grid; gap: 22px; padding-top: 22px; }
@media (min-width: 900px) { .grid { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); } }
.sec { border-top: 3px solid var(--ink); padding-top: 8px; }
.sec h3 { margin: 0 0 6px; font: 400 30px/1.05 var(--block); text-transform: uppercase; }
.shows { list-style: none; margin: 0; padding: 0; }
.shows li { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--ink); }
.shows li:last-child { border-bottom: 1px solid var(--ink); }
.shows .d { font: 900 18px/1.05 var(--serif); }
.shows .w { display: flex; flex-direction: column; min-width: 0; }
.shows .w span { font-size: 13px; }
.shows .hot { color: var(--accent); font-weight: 800; }
.shows li.sold { color: var(--muted); }
.tix { background: var(--ink); color: var(--paper); text-decoration: none; padding: 0 14px; min-height: 44px; display: flex; align-items: center; font: 800 13px var(--sans); letter-spacing: 1px; text-transform: uppercase; }
.tix.soon { background: transparent; color: var(--ink); }
.gone { font: 800 13px var(--sans); text-transform: uppercase; text-decoration: line-through; }
.side { display: grid; gap: 22px; }
.vid { display: block; position: relative; aspect-ratio: 16 / 9; background: var(--ink); overflow: hidden; }
.vid img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); opacity: .75; }
.vid i { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; }
.vid i::before { content: ""; border-left: 16px solid var(--ink); border-top: 10px solid transparent; border-bottom: 10px solid transparent; margin-left: 4px; }
.small { font-size: 13px; margin: 6px 0 0; }
.pod { display: flex; gap: 12px; align-items: center; }
.pod .art { width: 72px; height: 72px; flex: none; background: var(--accent); color: #fff; display: grid; place-items: center; font: 900 26px var(--serif); object-fit: cover; }
.pod .links { display: flex; gap: 10px; flex-wrap: wrap; font-size: 14px; }
.join { margin-top: 22px; padding: 16px; border: 3px solid var(--ink); display: grid; gap: 10px; }
.join h3 { margin: 0; font: 900 28px/1 var(--serif); }
.join p { margin: 0; font-size: 15px; }
.ctt-join { display: grid; gap: 10px; }
@media (min-width: 900px) { .ctt-join { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) auto; align-items: end; } .ctt-msg, .ctt-fine { grid-column: 1 / -1; } }
.ctt-join label { display: grid; gap: 4px; font-weight: 600; font-size: 14px; }
.ctt-join input { height: 46px; border: 1px solid var(--ink); background: #fff; padding: 0 12px; font: 400 16px var(--sans); min-width: 0; }
.ctt-join button { min-height: 48px; padding: 0 18px; border: 0; background: var(--ink); color: var(--paper); font: 800 14px var(--sans); letter-spacing: 2px; text-transform: uppercase; cursor: pointer; }
.ctt-msg { font-weight: 700; min-height: 1.2em; } .ctt-fine { font-size: 12px; color: var(--muted); }
.socials { display: flex; gap: 16px; flex-wrap: wrap; padding: 18px 0 4px; font: 800 14px var(--sans); text-transform: uppercase; letter-spacing: 1px; }
.socials a { min-height: 44px; display: inline-flex; align-items: center; }
footer { margin-top: 14px; padding: 14px 16px 18px; font-size: 12px; border-top: 3px double var(--ink); }
.ctt-down { padding: 60px 20px; text-align: center; }
</style>
</head>
<body>
<main id="app"><p class="ctt-down">Loading…</p></main>
<script src="config.js"></script>
<script src="sdk/csb.js"></script>
<script src="sdk/templates.js"></script>
<script>
CTT.start(function (k, app) {
  "use strict";
  var el = k.el;
  // keep these in step with theme.json (a test checks)
  var W = { masthead: "The {name} Daily", edition_left: "Vol. 1 · No. 1", edition_mid: "Late Edition", edition_right: "Free",
    banner_left: "Breaking", banner_right: "Tickets on sale now", headline: "Local comic plays {next_venue} {next_date}",
    subhead: "Sources confirm: there are still seats.", caption: "{name}, pictured.", shows_title: "Where to catch the act",
    video_title: "Caught on tape", podcast_title: "On the air", join_title: "Subscribe. It's free.",
    join_line: "Get word first when {name} plays near you.", join_button: "Deliver it to me", footer: "Stop the presses." };
  var say = function (key) { return k.t(key, W[key]).replace(/\s+/g, " ").trim(); };
  var opt = function (tag, attrs, key) { var s = say(key); return s ? el(tag, Object.assign({ text: s }, attrs || {})) : null; };
  var video = k.video(), pod = k.podcast(), shows = k.shows(), socials = k.socials(), join = k.join({ button: say("join_button") || W.join_button });
  var paper = el("div", { class: "paper" });

  var ed = [opt("span", null, "edition_left"), opt("span", null, "edition_mid"), opt("span", null, "edition_right")].filter(Boolean);
  paper.append(el("header", { class: "mast" }, [ed.length ? el("div", { class: "edition" }, ed) : null, el("h1", { text: say("masthead") || k.name })]));
  var ban = [opt("span", null, "banner_left"), opt("span", null, "banner_right")].filter(Boolean);
  if (ban.length) paper.append(el("div", { class: "banner" }, ban));

  var body = el("div", { class: "body" });
  var lead = [opt("h2", null, "headline"), opt("p", null, "subhead")].filter(Boolean);
  if (lead.length) body.append(el("div", { class: "lead" }, lead));
  var bio = k.bio, copy = bio ? el("p", { class: "copy" }, [el("b", { class: "cap", "aria-hidden": "true", text: bio[0] }), el("span", { class: "rest" }, [el("span", { style: "position:absolute;left:-9999px", text: bio[0] }), bio.slice(1)])]) : null;
  if (k.photo || copy) body.append(el("div", { class: "story" }, [k.photo ? el("figure", null, [k.coaster && k.coasterPhoto ? k.coasterPhoto() : el("img", { src: k.photo, alt: k.name }), opt("figcaption", null, "caption")]) : null, copy]));

  var grid = el("div", { class: "grid" });
  if (k.has("shows")) grid.append(el("section", { class: "sec", "aria-label": say("shows_title") || "Shows" }, [opt("h3", null, "shows_title"),
    shows.length ? el("ul", { class: "shows" }, shows.map(function (s) {
      return el("li", { class: s.sold ? "sold" : "" }, [el("b", { class: "d" }, [s.dow, el("br"), s.mon + " " + s.day]),
        el("span", { class: "w" }, [el("b", { text: s.venue }), s.few ? el("span", { class: "hot", text: "A few left" }) : el("span", { text: s.city })]),
        s.sold ? el("span", { class: "gone", text: "Sold out" }) : k.ticket(s, "tix")]);
    })) : el("p", { text: "No dates right now." })]));
  var side = el("div", { class: "side" });
  if (video) side.append(el("section", { class: "sec", "aria-label": say("video_title") || "Video" }, [opt("h3", null, "video_title"),
    el("a", { class: "vid", href: video.link, target: "_blank", rel: "noopener", "aria-label": "Watch " + video.title }, [el("img", { src: video.thumbnail, alt: "", loading: "lazy" }), el("i", { "aria-hidden": "true" })]),
    el("p", { class: "small", text: video.title })]));
  if (pod) side.append(el("section", { class: "sec", "aria-label": say("podcast_title") || "Podcast" }, [opt("h3", null, "podcast_title"),
    el("div", { class: "pod" }, [pod.art ? el("img", { class: "art", src: pod.art, alt: "" }) : el("span", { class: "art", "aria-hidden": "true", text: (pod.name.indexOf(" ") > 0 ? pod.name.split(/\s+/).map(function (w) { return w[0]; }).join("") : pod.name).slice(0, 2).toUpperCase() }),
      el("div", null, [el("b", { text: pod.name }), el("div", { class: "links" }, pod.links.map(function (l) { return el("a", { href: l.url, target: "_blank", rel: "noopener", text: l.label }); }))])])]));
  if (side.childNodes.length) grid.append(side);
  body.append(grid);

  if (join) body.append(el("section", { class: "join", "aria-label": "Mailing list" }, [opt("h3", null, "join_title"), opt("p", null, "join_line"), join]));
  if (socials.length) body.append(el("div", { class: "socials" }, socials.map(function (x) { return el("a", { href: x.url, target: "_blank", rel: "noopener", text: x.label }); })));
  paper.append(body, el("footer", { text: ["© " + new Date().getFullYear() + " " + k.name, "Printed on ComicTable", say("footer")].filter(Boolean).join(" · ") }));
  app.append(paper);
});
</script>
</body>
</html>
