<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comedian</title>
<meta name="description" content="Shows, videos and more.">
<meta property="og:title" content="Comedian" data-ct="title">
<meta property="og:description" content="Shows, videos and more." data-ct="description">
<meta property="og:image" content="" data-ct="image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Monoton&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Public Access: a ComicTable template. 80s public-access TV on a worn VHS tape. Every word that isn't the comic's own
   data is a Design setting (theme.json), so nothing jokey is baked in. */
:root { --bg: #0B0A24; --text: #E8E6FF; --soft: #A9A5DD; --cyan: #5CF2FF; --gold: #FFD447; --accent: #FF3EA5;
  --vt: "VT323", "Courier New", monospace; --neon: "Monoton", Impact, sans-serif; --font: "Space Grotesk", system-ui, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px); color: var(--text); font: 500 17px/1.45 var(--font); }
a { color: var(--cyan); }
img { display: block; max-width: 100%; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.tape { max-width: 680px; margin: 0 auto; padding: 0 16px 10px; }
.osd { display: flex; justify-content: space-between; gap: 10px; padding: 12px 0; font: 400 24px var(--vt); color: var(--cyan); }
.frame { position: relative; aspect-ratio: 4 / 4; max-height: 520px; width: 100%; overflow: hidden; border: 3px solid var(--accent); box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 55%, transparent); }
.frame img { width: 100%; height: 100%; object-fit: cover; filter: saturate(1.4) contrast(1.1); }
.frame::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(11,10,36,.9)), repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px 4px); }
.rec { position: absolute; z-index: 1; left: 12px; top: 10px; font: 400 22px var(--vt); color: #fff; text-shadow: 2px 0 var(--accent), -2px 0 var(--cyan); }
.frame h1 { position: absolute; z-index: 1; left: 14px; right: 14px; bottom: 12px; }
h1 { margin: 0; font: 400 clamp(40px, 11vw, 64px)/1.05 var(--neon); color: #fff; text-shadow: 0 0 10px var(--accent), 0 0 22px var(--accent); text-transform: uppercase; overflow-wrap: anywhere; }
.coast { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 6px 0 4px; text-align: center; }
.coast .ct-coaster { width: min(86%, 360px); }
.bio { margin: 14px 0 0; font: 400 22px/1.15 var(--vt); color: #C9C5FF; text-transform: uppercase; }
.guide { margin-top: 24px; border: 2px solid var(--cyan); background: rgba(92,242,255,.06); }
.guide .bar { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; background: var(--cyan); color: var(--bg); font: 400 24px var(--vt); }
.row { display: grid; grid-template-columns: 78px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 12px; border-bottom: 1px dashed rgba(92,242,255,.5); }
.row:last-child { border-bottom: 0; }
.row .d { font: 400 26px var(--vt); color: var(--gold); }
.row .w { display: flex; flex-direction: column; min-width: 0; }
.row .w span { font-size: 14px; color: var(--soft); }
.row.sold { opacity: .6; }
.tix { background: var(--accent); color: #fff; text-decoration: none; padding: 0 14px; min-height: 44px; display: flex; align-items: center; font: 400 22px var(--vt); }
.tix.soon { background: transparent; border: 2px solid var(--text); color: var(--text); }
.gone { border: 2px solid var(--text); padding: 6px 10px; font: 400 20px var(--vt); white-space: nowrap; }
.empty { margin: 0; padding: 12px; }
.now { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; }
.h { margin: 0; font: 400 26px var(--vt); color: var(--gold); font-weight: 400; }
.deck { background: #111; border-radius: 6px; padding: 14px 14px 12px; box-shadow: 0 10px 0 #05040F; }
.deck a.screen { display: block; position: relative; aspect-ratio: 16 / 9; background: linear-gradient(135deg, #3A1C71, #D76D77 60%, #FFAF7B); overflow: hidden; }
.deck img { width: 100%; height: 100%; object-fit: cover; opacity: .85; }
.deck a.screen::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0 2px, transparent 2px 4px); }
.deck i { position: absolute; z-index: 1; left: 50%; top: 50%; margin: -24px 0 0 -18px; border-left: 40px solid #fff; border-top: 24px solid transparent; border-bottom: 24px solid transparent; filter: drop-shadow(0 0 6px rgba(0,0,0,.6)); }
.label { margin-top: 12px; background: #F4F1E6; color: #1A1A1A; padding: 8px 12px; font: 700 15px var(--font); border-left: 10px solid var(--accent); text-transform: uppercase; }
.pod { margin-top: 26px; display: flex; gap: 14px; align-items: center; padding: 14px; border: 2px solid var(--accent); }
.pod .art { width: 70px; height: 70px; flex: none; border-radius: 50%; background: conic-gradient(var(--accent), var(--cyan), var(--gold), var(--accent)); object-fit: cover; }
.pod .k { font: 400 20px var(--vt); color: var(--cyan); display: block; }
.pod b { font-size: 22px; display: block; }
.pod .links { display: flex; gap: 12px; flex-wrap: wrap; font-size: 14px; }
.socials { margin-top: 26px; display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
.socials a { text-align: center; padding: 12px 0; min-height: 44px; border: 2px solid var(--cyan); color: var(--cyan); text-decoration: none; font: 400 22px var(--vt); text-transform: uppercase; }
.join { margin: 26px 0 24px; padding: 18px; background: #1A1745; border: 2px solid var(--gold); display: flex; flex-direction: column; gap: 10px; }
.join h2 { margin: 0; font: 400 32px/1 var(--vt); color: var(--gold); }
.join p { margin: 0; font-size: 16px; }
.ctt-join { display: grid; gap: 10px; }
.ctt-join label { display: grid; gap: 4px; font: 400 20px var(--vt); text-transform: uppercase; }
.ctt-join input { height: 46px; border: 2px solid var(--cyan); background: var(--bg); color: var(--text); padding: 0 12px; font: 500 16px var(--font); }
.ctt-join button { min-height: 50px; border: 0; background: var(--accent); color: #fff; font: 400 26px var(--vt); cursor: pointer; }
.ctt-msg { color: var(--gold); min-height: 1.2em; }
.ctt-fine { font-size: 13px; color: var(--soft); }
footer { padding: 14px 0 20px; text-align: center; font: 400 18px var(--vt); color: #8A86C9; text-transform: uppercase; }
.ctt-down { padding: 60px 20px; text-align: center; }
@media (min-width: 900px) { .tape { max-width: 980px; } .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: start; } .grid > .guide { margin-top: 26px; } }
</style>
</head>
<body>
<main id="app"><p class="ctt-down">Loading…</p></main>
<script src="config.js"></script>
<script src="sdk/csb.js"></script>
<script src="sdk/templates.js"></script>
<script>
CTT.start(function (k, app) {
  "use strict";
  var el = k.el;
  // keep these in step with theme.json (a test checks)
  var W = { channel: "CH 03", osd: "▶ PLAY", rec: "REC ●", shows_title: "TV GUIDE · LIVE SHOWS", watch_title: "▶▶ NOW PLAYING", podcast_label: "PODCAST",
    join_title: "CALL IN NOW!", join_line: "Get on the list. Hear first when {name} plays near you.", join_button: "SIGN ME UP ▶", footer: "BE KIND, REWIND" };
  var say = function (key) { return k.t(key, W[key]); };
  var video = k.video(), pod = k.podcast(), shows = k.shows(), socials = k.socials(), join = k.join({ button: say("join_button") || W.join_button });
  var tape = el("div", { class: "tape" });

  if (say("channel") || say("osd")) tape.append(el("div", { class: "osd" }, [el("span", { text: say("channel") }), el("span", { text: say("osd") })]));
  var name = el("h1", { text: k.name });
  if (k.coaster) tape.append(el("div", { class: "coast" }, [k.coasterPhoto(), name]));
  else if (k.photo) tape.append(el("div", { class: "frame" }, [el("img", { src: k.photo, alt: k.name }), say("rec") ? el("span", { class: "rec", "aria-hidden": "true", text: say("rec") }) : null, name]));
  else tape.append(name);
  if (k.bio) tape.append(el("p", { class: "bio", text: k.bio }));

  var grid = el("div", { class: "grid" }), side = el("div");
  if (k.has("shows")) grid.append(el("section", { class: "guide", "aria-label": say("shows_title") || "Shows" }, [
    say("shows_title") ? el("div", { class: "bar" }, [el("h2", { style: "margin:0;font:inherit", text: say("shows_title") }), shows[0] ? el("span", { text: shows[0].mon.toUpperCase() }) : null]) : null].concat(
    shows.length ? shows.map(function (s) {
      return el("div", { class: "row" + (s.sold ? " sold" : "") }, [el("span", { class: "d", text: s.dow.toUpperCase() + " " + s.dd }),
        el("span", { class: "w" }, [el("b", { text: s.venue }), el("span", { text: [s.city, s.few ? "A few left" : s.time].filter(Boolean).join(" · ") })]),
        s.sold ? el("span", { class: "gone", text: "SOLD OUT" }) : k.ticket(s, "tix", "TIX")]);
    }) : [el("p", { class: "empty", text: "No dates right now." })])));
  if (video) side.append(el("section", { class: "now", "aria-label": say("watch_title") || "Video" }, [say("watch_title") ? el("h2", { class: "h", text: say("watch_title") }) : null,
    el("div", { class: "deck" }, [el("a", { class: "screen", href: video.link, target: "_blank", rel: "noopener", "aria-label": "Watch " + video.title }, [el("img", { src: video.thumbnail, alt: "", loading: "lazy" }), el("i", { "aria-hidden": "true" })]),
      el("div", { class: "label", text: video.title })])]));
  if (pod) side.append(el("div", { class: "pod" }, [pod.art ? el("img", { class: "art", src: pod.art, alt: "" }) : el("span", { class: "art", "aria-hidden": "true" }),
    el("div", null, [say("podcast_label") ? el("span", { class: "k", text: say("podcast_label") }) : null, el("b", { text: pod.name }), el("div", { class: "links" }, pod.links.map(function (l) { return el("a", { href: l.url, target: "_blank", rel: "noopener", text: l.label }); }))])]));
  grid.append(side); tape.append(grid);

  if (socials.length) tape.append(el("div", { class: "socials" }, socials.map(function (x) { return el("a", { href: x.url, target: "_blank", rel: "noopener", text: x.label }); })));
  if (join) tape.append(el("section", { class: "join", "aria-label": "Mailing list" }, [say("join_title") ? el("h2", { text: say("join_title") }) : null, say("join_line") ? el("p", { text: say("join_line") }) : null, join]));
  tape.append(el("footer", { text: ["Runs on ComicTable", say("footer")].filter(Boolean).join(" · ") }));
  app.append(tape);
});
</script>
</body>
</html>
